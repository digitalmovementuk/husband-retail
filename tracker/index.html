    tkHead();
    requestAnimationFrame(function(){ tlMeasure("scr-track"); });
  }

  /* --------------------------------------------------- progress bar fills */
  function fillBars(scope){
    requestAnimationFrame(function(){
      Array.prototype.forEach.call(scope.querySelectorAll(".pbar i[data-w]"), function(b){
        b.style.width = b.dataset.w + "%";
      });
    });
  }

  /* ============================================================ SCREENS == */
  var TITLES = { dash:"Dashboard", overview:"Overview", plan:"Timeline",
                 track:"Your tracker", work:"Projects", you:"Waiting on you" };
  var ALIAS = { now:"dash" };   /* older shared links still land somewhere sane */
  var screen = "dash", mem = {};
  var tabBtns = Array.prototype.slice.call($("tabs").querySelectorAll("button"));

  /* Skipping the layout of an off-screen month is only safe once its real
     height is recorded — otherwise the page changes length under his thumb.
     So it is measured the first time the screen is actually on, then never
     again, and the browser is told to remember it from there. */
  function tlMeasure(id){
    var gs = $(id || "scr-plan").querySelectorAll(".tl-g");
    if (!gs.length || !gs[0].offsetHeight) return;
    Array.prototype.forEach.call(gs, function(g){
      if (g.dataset.h) return;
      /* ceil, not round: an intrinsic size a fraction UNDER the real one makes
         the page grow as each month renders. Over is invisible. */
      var h = Math.ceil(g.getBoundingClientRect().height);
      if (!h) return;
      g.dataset.h = h;
      g.style.setProperty("contain-intrinsic-size", "auto " + h + "px");
      g.style.setProperty("content-visibility", "auto");
    });
  }

  /* ========================================================= MESSAGE US ==
     He can reach us from any screen without leaving the app. The message goes
     to our own endpoint, which puts it in front of a human — it is not stored
     on his phone and there is no reply channel in here, so the sheet says
     exactly that rather than implying a chat. */
  var MSG_URL = "https://leads.digitalmovement.uk/hr-message.php";

  function msgSheet(){
    openSheet(
      '<div class="sh-k" style="color:var(--tx-3)">Message us</div>' +
      '<h2 class="sh-t">Ask us anything</h2>' +
      '<p class="sh-d">A question, a change, something that looks wrong. It goes ' +
        'straight to the team working on your programme.</p>' +
      '<div class="ans"><textarea class="sh-out msg-tx" id="msgTx" ' +
        'placeholder="Type your message"></textarea></div>' +
      /* the honeypot: a real person never sees this, a bot fills it in */
      '<input type="text" name="company" id="msgHp" tabindex="-1" autocomplete="off" ' +
        'aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px">' +
      '<button type="button" class="msg-s" id="msgGo">Send</button>' +
      '<div class="msg-e" id="msgErr" hidden></div>' +
      '<div class="sh-w">We reply by email. There is no inbox in this app, so ' +
        'nothing you send here shows up on this screen again.</div>');

    var t0 = Date.now();
    var tx = $("msgTx"), go2 = $("msgGo"), err = $("msgErr");
    setTimeout(function(){ tx.focus(); }, 260);

    go2.addEventListener("click", function(){
      var text = (tx.value || "").trim();
      err.hidden = true;
      if (text.length < 2){ err.textContent = "Type a message first."; err.hidden = false; return; }
      go2.disabled = true; go2.textContent = "Sending…";

      fetch(MSG_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          message: text,
          /* more than one client signs into this app now, so the message has to
             say who is writing rather than assuming */
          from:    (window.PPLUS && window.PPLUS.who) || "",
          screen:  TITLES[screen] || screen,
          hp:      $("msgHp").value,
          ms:      Date.now() - t0,
          consent: true
        })
      })
      .then(function(r){ return r.json().catch(function(){ return { ok: r.ok }; }); })
      .then(function(j){
        if (!j || !j.ok) throw new Error((j && j.error) || "not delivered");
        buzz(14);
        openSheet(
          '<div class="sh-k" style="color:var(--green)">Sent</div>' +
          '<h2 class="sh-t">It is with us</h2>' +
          '<p class="msg-ok">We have your message. We will come back to you ' +
            'by email.</p>');
      })
      .catch(function(e){
        go2.disabled = false; go2.textContent = "Send";
        err.innerHTML = "That did not send. Email us at " +
          '<a href="mailto:hello@digitalmovement.uk?subject=Husband%20Retail%20programme" ' +
          'style="color:var(--amber)">hello@digitalmovement.uk</a> and we will pick it up.';
        err.hidden = false;
      });
    });
  }
  $("msgB").addEventListener("click", msgSheet);

  function go(k){
    if (!TITLES[k]) return;
    mem[screen] = window.pageYOffset || 0;
    document.getElementById("scr-" + screen).classList.remove("on");
    screen = k;
    var node = document.getElementById("scr-" + screen);
    node.classList.add("on");
    $("barTitle").textContent = TITLES[k];
    tabBtns.forEach(function(b){
      var on = b.dataset.s === k;
      b.classList.toggle("on", on);
      b.setAttribute("aria-current", on ? "page" : "false");
    });
    closeSheet();
    window.scrollTo(0, mem[k] || 0);
    fillBars(node);
    if (k === "plan" || k === "track")
      requestAnimationFrame(function(){ tlMeasure("scr-" + k); });
    onScroll();
    if (location.hash !== "#" + k) history.replaceState(null, "", "#" + k);
  }
  tabBtns.forEach(function(b){
    b.addEventListener("click", function(){
      /* tapping the tab you are already on jumps back to the top, the way
         every other app on the phone behaves */
      if (b.dataset.s === screen){
        window.scrollTo({ top:0, behavior: reduced ? "auto" : "smooth" });
        return;
      }
      go(b.dataset.s);
    });
  });

  /* a shared link like …/tracker/#you opens on that screen, even if the app
     is already open — the browser does not reload for a hash change */
  window.addEventListener("hashchange", function(){
    var k = location.hash.replace(/^#/, "");
    if (ALIAS[k]) k = ALIAS[k];
    if (TITLES[k] && k !== screen) go(k);
  });

  /* the bar title appears once the large title has scrolled away */
  var bar = $("bar");
  /* Scroll has to be free. Everything this used to measure on every event —
     the filter strip's height, which month had reached the top — is now a CSS
     constant or handled by position:sticky, so the only job left is the
     hairline under the top bar, and even that waits for a frame. Reading
     layout and writing a custom property on every scroll event was what made
     this stutter on a phone. */
  var ticking = false, barOn = false;
  function onScroll(){
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function(){
      ticking = false;
      var on = (window.pageYOffset || 0) > 42;
      if (on !== barOn){ barOn = on; bar.classList.toggle("on", on); }
    });
  }
  window.addEventListener("scroll", onScroll, { passive:true });

  /* ============================================================== BOOT === */
  $("youBadge").textContent = outstanding;
  $("youBadge").hidden = !outstanding;

  tkLoad();

  buildDash();
  buildOverview();
  buildPlan();
  buildTrack();
  buildWork();
  buildYou();

  var h = location.hash.replace(/^#/, "");
  if (ALIAS[h]) h = ALIAS[h];
  go(TITLES[h] ? h : "dash");

  /* the "since you last looked" list is built from the snapshot taken on his
     PREVIOUS visit, so it is only stamped once this visit has been rendered */
  fillBars(document);
  onScroll();

  /* The sign-in screen owns the account, so it adds the way out — after the
     screens exist, because it hangs off the bottom of "You". */
  if (window.PPLUS && window.PPLUS.addSignOut) { window.PPLUS.addSignOut(); }

};
</script>

<!-- Google's sign-in library. It is the one thing on this page fetched from
     somewhere else, and it is here because a "Continue with Google" button that
     is not Google's own button is a button people do not trust. Nothing is sent
     to Google unless the button is pressed, and this app is behind a sign-in and
     marked noindex, so it is not a page that needs to be third-party clean
     before a visitor has agreed to anything. -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
/* ============================================================== PROJECT+ ===
   The sign-in screen, and the only thing that can start the app.

   HOW IT HANGS TOGETHER
   1. This runs. The app underneath is hidden and, more to the point, empty.
   2. It works out who you are — a link from an email, a session saved on this
      phone, Google, or an email and a password.
   3. With that proof it asks our server for the programme.
   4. Only when the programme has arrived does it call window.__pplusBoot(),
      which is the whole app.

   So there is no moment where the app exists and the sign-in has not happened.
   It is not a curtain in front of the content; the content is not here yet. */
(function(){
  "use strict";

  var AUTH  = "https://leads.digitalmovement.uk/pplus-auth.php";
  var DATA  = "https://leads.digitalmovement.uk/pplus-data.php";
  var ASSET = "https://leads.digitalmovement.uk/pplus-asset.php";

  /* Public on purpose. It names the app to Google; it is not a key, and Google
     also checks the web address the request came from. */
  var GOOGLE_CLIENT_ID = "1026787930268-mdjj3bvarruaadbhnk5gne4m840a7cmv.apps.googleusercontent.com";

  var KEY = "pplus-session";                       /* the signed proof */
  var WHO = "pplus-who";                           /* whose proof it is */
  var APPKEYS = ["hr-tracker-v1", "hr-answers-v1"];/* one person's own ticks and notes */

  var gate = document.getElementById("gate");
  var body = document.getElementById("gateBody");
  var sub  = document.getElementById("gateSub");

  window.PPLUS = window.PPLUS || {};

  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

  /* ------------------------------------------------------------- the proof */

  function token(){ try { return localStorage.getItem(KEY) || ""; } catch(e){ return ""; } }

  function setToken(t, email){
    try {
      /* Two people, one iPad. The second one must not open the app and find the
         first one's ticks and answers sitting there under their own name. */
      var last = localStorage.getItem(WHO);
      if (email && last && last !== email){
        APPKEYS.forEach(function(k){ localStorage.removeItem(k); });
      }
      if (t){ localStorage.setItem(KEY, t); if (email) localStorage.setItem(WHO, email); }
      else  { localStorage.removeItem(KEY); }
    } catch(e){}
  }

  function clearAll(){
    try {
      localStorage.removeItem(KEY); localStorage.removeItem(WHO);
      APPKEYS.forEach(function(k){ localStorage.removeItem(k); });
    } catch(e){}
  }

  /* ------------------------------------------------------------- the wire */

  function post(url, payload, cb){
    var h = { "Content-Type": "application/json" };
    var t = token(); if (t){ h.Authorization = "Bearer " + t; }
    fetch(url, { method:"POST", headers:h, body:JSON.stringify(payload) })
      .then(function(r){
        return r.text().then(function(txt){
          var j; try { j = JSON.parse(txt); } catch(e){ j = null; }
          /* A server that answers with something other than an answer is a
             server problem, and should say so rather than blaming the person. */
          if (!j){ return { ok:false, error:"The server gave an answer we could not read. Please tell us.", code:"badjson" }; }
          j.__status = r.status; return j;
        });
      })
      .then(cb)
      .catch(function(){
        cb({ ok:false, error:"We could not reach the server. Check your connection and try again.", code:"net" });
      });
  }

  function api(action, payload, cb){
    payload = payload || {}; payload.action = action;
    post(AUTH, payload, cb);
  }

  /* --------------------------------------------------------- small pieces */

  function waiting(msg){ body.innerHTML = '<p class="gate-wait">' + esc(msg) + '</p>'; }

  function msgBox(){
    var m = $("ppMsg");
    if (!m){ body.insertAdjacentHTML("beforeend", '<div id="ppMsg"></div>'); m = $("ppMsg"); }
    return m;
  }
  function showErr(msg){
    msgBox().innerHTML = '<div class="gate-err"><b>That did not work</b>' + esc(msg) + '</div>';
  }
  function showOk(title, msg){
    msgBox().innerHTML = '<div class="gate-ok"><b>' + esc(title) + '</b>' + esc(msg) + '</div>';
  }
  function busy(b, t){ if (b){ b.disabled = true; b.textContent = t; } }
  function done(b, t){ if (b){ b.disabled = false; b.textContent = t; } }

  function seeToggle(){
    var s = $("ppSee"); if (!s) return;
    s.addEventListener("click", function(){
      var i = $("ppPw"), hidden = i.type === "password";
      i.type = hidden ? "text" : "password";
      s.textContent = hidden ? "Hide" : "Show";
    });
  }

  var EMAIL_FIELD =
    '<div class="gate-f">' +
      '<label class="gate-l" for="ppEmail">Email address</label>' +
      '<input class="gate-i" id="ppEmail" type="email" name="email" autocomplete="username" ' +
        'inputmode="email" autocapitalize="off" autocorrect="off" spellcheck="false" required>' +
    '</div>';

  function pwField(label, mode, hint){
    return '<div class="gate-f">' +
      '<label class="gate-l" for="ppPw">' + esc(label) + '</label>' +
      '<div class="gate-pw">' +
        '<input class="gate-i" id="ppPw" type="password" name="password" autocomplete="' + mode + '" required>' +
        '<button type="button" class="gate-see" id="ppSee">Show</button>' +
      '</div>' +
      (hint ? '<p class="gate-hint">' + esc(hint) + '</p>' : '') +
    '</div>';
  }

  /* --------------------------------------------------------------- Google */

  var gStarted = false;

  /* The library is loaded with async, so it may not be here yet. Wait for it
     quietly: if it never arrives, the email and password route is untouched and
     the screen still works. */
  function withGoogle(fn){
    var n = 0;
    (function tick(){
      if (window.google && google.accounts && google.accounts.id) return fn();
      if (++n > 60) return;
      setTimeout(tick, 150);
    })();
  }

  function googleButton(el){
    if (!el) return;
    withGoogle(function(){
      if (!gStarted){
        google.accounts.id.initialize({
          client_id: GOOGLE_CLIENT_ID,
          callback: onGoogle,
          ux_mode: "popup",
          auto_select: false
        });
        gStarted = true;
      }
      google.accounts.id.renderButton(el, {
        theme: "filled_white", size: "large", shape: "pill",
        text: "continue_with", logo_alignment: "center",
        width: Math.max(240, Math.min(360, el.clientWidth || 320))
      });
    });
  }

  function onGoogle(res){
    if (!res || !res.credential){ showErr("Google did not finish signing you in. Please try again."); return; }
    waiting("Signing you in…");
    api("google", { credential: res.credential }, handleAuth);
  }

  /* --------------------------------------------------------------- screens */

  function renderSignIn(note){
    sub.textContent = "Sign in to see your programme.";
    body.innerHTML =
      '<div class="gate-g" id="gBtn"></div>' +
      '<p class="gate-gnote">One tap, if your email address is a Google account.</p>' +
      '<div class="gate-or">or</div>' +
      '<form id="ppF" novalidate>' + EMAIL_FIELD + pwField("Password", "current-password", "") +
        '<button type="submit" class="gate-go" id="ppGo">Sign in</button>' +
      '</form>' +
      '<div id="ppMsg"></div>' +
      '<p class="gate-alt">New here? <button type="button" id="ppToReg">Create an account</button><br>' +
        '<button type="button" id="ppToForgot">Forgotten your password?</button></p>';

    googleButton($("gBtn"));
    seeToggle();
    if (note) showErr(note);

    $("ppToReg").addEventListener("click", function(){ renderRegister(); });
    $("ppToForgot").addEventListener("click", function(){ renderForgot(); });

    $("ppF").addEventListener("submit", function(e){
      e.preventDefault();
      var em = ($("ppEmail").value || "").trim(), pw = $("ppPw").value || "";
      if (!em || !pw){ showErr("Please put in your email address and password."); return; }
      busy($("ppGo"), "Signing in…");
      api("login", { email: em, password: pw }, function(j){
        done($("ppGo"), "Sign in");
        if (j && j.ok === true) return handleAuth(j);
        if (j && j.code === "unverified") return renderSent(em);
        showErr((j && j.error) || "That did not work. Please try again.");
      });
    });
  }

  function renderRegister(){
    sub.textContent = "Create your account.";
    body.innerHTML =
      '<div class="gate-g" id="gBtn"></div>' +
      '<p class="gate-gnote">Google makes the account for you — there is nothing else to fill in.</p>' +
      '<div class="gate-or">or</div>' +
      '<form id="ppF" novalidate>' +
        '<div class="gate-f">' +
          '<label class="gate-l" for="ppName">Your name</label>' +
          '<input class="gate-i" id="ppName" type="text" name="name" autocomplete="name" required>' +
        '</div>' +
        EMAIL_FIELD +
        pwField("Choose a password", "new-password", "At least 10 characters. A short sentence you will remember beats a clever word.") +
        /* invisible to a person, irresistible to a robot */
        '<input type="text" id="ppHp" name="company" tabindex="-1" autocomplete="off" aria-hidden="true" ' +
          'style="position:absolute;left:-9999px;width:1px;height:1px">' +
        '<button type="submit" class="gate-go" id="ppGo">Create account</button>' +
      '</form>' +
      '<div id="ppMsg"></div>' +
      '<p class="gate-alt">Already have an account? <button type="button" id="ppToIn">Sign in</button></p>';

    googleButton($("gBtn"));
    seeToggle();
    $("ppToIn").addEventListener("click", function(){ renderSignIn(); });

    $("ppF").addEventListener("submit", function(e){
      e.preventDefault();
      var nm = ($("ppName").value || "").trim();
      var em = ($("ppEmail").value || "").trim();
      var pw = $("ppPw").value || "";
      if (!nm){ showErr("Please put your name in."); return; }
      if (!em){ showErr("Please put your email address in."); return; }
      if (pw.length < 10){ showErr("Please use a password of at least 10 characters."); return; }
      busy($("ppGo"), "Creating…");
      api("register", { name:nm, email:em, password:pw, hp:$("ppHp").value }, function(j){
        done($("ppGo"), "Create account");
        if (j && j.ok === true && j.token) return handleAuth(j);   /* already proven, e.g. via Google */
        if (j && j.ok === true) return renderSent(em);
        showErr((j && j.error) || "That did not work. Please try again.");
      });
    });
  }

  function renderSent(email){
    sub.textContent = "Check your email.";
    body.innerHTML =
      '<div id="ppMsg"></div>' +
      '<button type="button" class="gate-go quiet" id="ppResend">Send the link again</button>' +
      '<p class="gate-alt"><button type="button" id="ppToIn">Back to sign in</button></p>';
    showOk("One more step",
      "We have sent a link to " + email + ". Open it on this phone and you are in. " +
      "If it is not there in a minute, look in your junk folder.");

    $("ppToIn").addEventListener("click", function(){ renderSignIn(); });
    $("ppResend").addEventListener("click", function(){
      busy($("ppResend"), "Sending…");
      api("resend", { email: email }, function(){
        done($("ppResend"), "Send the link again");
        showOk("Sent", "Another link is on its way to " + email + ".");
      });
    });
  }

  function renderForgot(){
    sub.textContent = "We will send you a link to set a new one.";
    body.innerHTML =
      '<form id="ppF" novalidate>' + EMAIL_FIELD +
        '<button type="submit" class="gate-go" id="ppGo">Send me a link</button>' +
      '</form>' +
      '<div id="ppMsg"></div>' +
      '<p class="gate-alt"><button type="button" id="ppToIn">Back to sign in</button></p>';

    $("ppToIn").addEventListener("click", function(){ renderSignIn(); });
    $("ppF").addEventListener("submit", function(e){
      e.preventDefault();
      var em = ($("ppEmail").value || "").trim();
      if (!em){ showErr("Please put your email address in."); return; }
      busy($("ppGo"), "Sending…");
      api("forgot", { email: em }, function(){
        done($("ppGo"), "Send me a link");
        /* Always the same answer, whether or not that address has an account —
           otherwise this screen becomes a way of finding out who is a client. */
        showOk("On its way",
          "If " + em + " has an account, a link is in the inbox now. It works for the next two days.");
      });
    });
  }

  function renderReset(tok){
    sub.textContent = "Set a new password.";
    body.innerHTML =
      '<form id="ppF" novalidate>' +
        pwField("New password", "new-password", "At least 10 characters.") +
        '<button type="submit" class="gate-go" id="ppGo">Save and sign in</button>' +
      '</form>' +
      '<div id="ppMsg"></div>' +
      '<p class="gate-alt"><button type="button" id="ppToIn">Back to sign in</button></p>';

    seeToggle();
    $("ppToIn").addEventListener("click", function(){ renderSignIn(); });
    $("ppF").addEventListener("submit", function(e){
      e.preventDefault();
      var pw = $("ppPw").value || "";
      if (pw.length < 10){ showErr("Please use a password of at least 10 characters."); return; }
      busy($("ppGo"), "Saving…");
      api("reset", { token: tok, password: pw }, function(j){
        done($("ppGo"), "Save and sign in");
        if (j && j.ok === true) return handleAuth(j);
        showErr((j && j.error) || "That link did not work. Ask for a new one.");
      });
    });
  }

  /* Signed in, no project yet. This is not a failure and must not read like one:
     they have done everything right, and there is exactly one thing left to do.

     The box searches while they type, but it never suggests and never completes.
     A name is either the name of their project or it is not there — and "not
     there" covers both "no such project" and "not yours", because a box that
     told those apart would be a way of finding out who our clients are. */
  function renderJoin(){
    sub.textContent = "Find your project.";
    body.innerHTML =
      '<form id="ppFindF" novalidate>' +
        '<div class="gate-f">' +
          '<label class="gate-l" for="ppQ">Project name</label>' +
          '<input class="gate-i" id="ppQ" type="text" name="project" autocomplete="off" ' +
            'autocapitalize="words" autocorrect="off" spellcheck="false" enterkeyhint="search">' +
          '<p class="gate-hint">Type it the way it is written on your paperwork. Capital letters do not matter.</p>' +
        '</div>' +
      '</form>' +
      '<div id="ppHit" aria-live="polite"></div>' +
      '<div id="ppMsg"></div>' +
      '<p class="gate-alt"><button type="button" id="ppAsk">Cannot find it? Ask us to open it</button><br>' +
        '<button type="button" id="ppOut2">Sign out</button></p>';

    var q = $("ppQ"), hit = $("ppHit"), timer = null, found = null;

    function clearHit(){ hit.innerHTML = ""; found = null; }

    function show(card){
      found = card;
      var src = (card.mark && /^data:image\//.test(card.mark)) ? card.mark : "";
      hit.innerHTML =
        '<div class="gate-card">' +
          (src ? '<img src="' + esc(src) + '" alt="">' : '') +
          '<div class="gate-card-t">' +
            '<span class="gate-card-b">' + esc(card.brand) + '</span>' +
            '<span class="gate-card-p">' + esc(card.project) + '</span>' +
          '</div>' +
        '</div>' +
        '<button type="button" class="gate-go" id="ppJoin">Join</button>';
      $("ppJoin").addEventListener("click", join);
    }

    /* Only say "no such project" once they have stopped — while somebody is
       still typing, half a name is not a mistake. */
    function miss(v){
      hit.innerHTML = '<p class="gate-none">There is no project called ' +
        '“' + esc(v) + '” on this account. Check the spelling, or ask us to open it for you.</p>';
    }

    function look(sayIfMissing){
      var v = (q.value || "").trim();
      if (v.length < 3){ clearHit(); return; }
      api("find", { q: v }, function(r){
        /* They carried on typing while we were asking — that answer is stale. */
        if ((q.value || "").trim() !== v) return;
        if (r && r.ok === true && r.found === true) return show(r);
        clearHit();
        if (sayIfMissing) miss(v);
      });
    }

    function join(){
      if (!found) return;
      var b = $("ppJoin");
      busy(b, "Opening…");
      api("join", { prog: found.prog }, function(r){
        done(b, "Join");
        if (r && r.ok === true && r.pending !== true) return handleAuth(r);
        showErr((r && r.error) || "We could not open that project. Please tell us.");
      });
    }

    q.addEventListener("input", function(){
      clearHit();
      if (timer) clearTimeout(timer);
      timer = setTimeout(function(){ look(false); }, 400);
    });
    q.addEventListener("blur", function(){ if (!found) look(true); });
    $("ppFindF").addEventListener("submit", function(e){
      e.preventDefault();
      if (timer) clearTimeout(timer);
      q.blur();
      look(true);
    });

    $("ppOut2").addEventListener("click", signOut);
    $("ppAsk").addEventListener("click", function(){
      $("ppAsk").disabled = true;
      api("ask", {}, function(){
        showOk("We have your message",
          "Somebody will open your project and you will get an email. There is nothing else for you to do.");
      });
    });
  }

  /* ---------------------------------------------------------- the way in */

  function handleAuth(j){
    if (!j || j.ok !== true){
      renderSignIn((j && j.error) || "Something went wrong. Please try again.");
      return;
    }
    setToken(j.token, j.email);
    window.PPLUS.who   = j.name || j.email || "";
    window.PPLUS.email = j.email || "";
    if (j.pending === true){ renderJoin(); return; }
    loadData();
  }

  function loadData(){
    waiting("Opening your programme…");
    fetch(DATA, { headers: { Authorization: "Bearer " + token() } })
      .then(function(r){ return r.text().then(function(t){
        var j; try { j = JSON.parse(t); } catch(e){ j = null; }
        if (!j){ j = { ok:false, error:"The server gave an answer we could not read." }; }
        j.__status = r.status; return j; }); })
      .then(function(j){
        if (j.ok === true && j.data){
          window.TRACKER = j.data;
          /* Pictures come through the same door as the words. An <img> cannot
             send a header, so the pass travels in the address instead. */
          window.PPLUS.assetBase = ASSET + "?t=" + encodeURIComponent(token()) + "&f=";
          window.PPLUS.progName  = j.name || "";
          if (j.you){ window.PPLUS.who = j.you.name || window.PPLUS.who; window.PPLUS.email = j.you.email || window.PPLUS.email; }
          start();
          return;
        }
        if (j.pending === true) return renderJoin();
        if (j.__status === 401){ setToken("", ""); return renderSignIn("Please sign in again."); }
        renderSignIn(j.error || "We could not open your programme.");
      })
      .catch(function(){
        renderSignIn("We could not reach the server. Check your connection and try again.");
      });
  }

  function start(){
    /* The bar used to have one client's name typed into it. Now it says whose
       programme is actually open. */
    var c = document.querySelector(".bar-c");
    if (c && window.PPLUS.progName) c.textContent = window.PPLUS.progName;

    gate.hidden = true;
    document.body.classList.remove("pp-locked");
    try {
      window.__pplusBoot();
    } catch(err){
      document.body.classList.add("pp-locked");
      gate.hidden = false;
      renderSignIn("Your programme arrived but the app could not open it. Please tell us — that one is ours, not yours.");
    }
  }

  function signOut(){
    clearAll();
    if (window.google && google.accounts && google.accounts.id){
      try { google.accounts.id.disableAutoSelect(); } catch(e){}
    }
    /* A clean reload rather than tearing the app down by hand: nothing of the
       last person is left on the screen or in memory. */
    location.replace(location.pathname);
  }

  /* Added to the bottom of "You" once the app has drawn itself. */
  window.PPLUS.addSignOut = function(){
    var you = document.getElementById("scr-you");
    if (!you || document.getElementById("ppOut")) return;
    var d = document.createElement("div");
    d.className = "pp-out"; d.id = "ppOut";
    d.innerHTML = '<div class="who">Signed in as ' + esc(window.PPLUS.email || window.PPLUS.who) + '</div>' +
                  '<button type="button" id="ppOutB">Sign out</button>';
    you.appendChild(d);
    document.getElementById("ppOutB").addEventListener("click", signOut);
  };

  /* ----------------------------------------------------------- what to do */

  var qs = new URLSearchParams(location.search);
  var pv = qs.get("pv"), pr = qs.get("pr");

  if (pv){
    /* Take the link out of the address bar straight away, so it cannot be
       shared, bookmarked or read over a shoulder after it has been used. */
    history.replaceState(null, "", location.pathname + location.hash);
    waiting("Confirming your email…");
    api("verify", { token: pv }, handleAuth);
  } else if (pr){
    history.replaceState(null, "", location.pathname + location.hash);
    renderReset(pr);
  } else if (token()){
    waiting("Signing you in…");
    api("me", {}, function(j){
      if (j && j.ok === true) return handleAuth(j);
      setToken("", "");
      renderSignIn();
    });
  } else {
    renderSignIn();
  }
})();
</script>
</body>
</html>
