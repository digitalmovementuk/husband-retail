<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Project+</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" type="image/svg+xml" href="assets/dm-mark.svg">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Project+">
<meta name="theme-color" content="#000000" />
<meta name="description" content="Sign in to see your programme." />
<style>
/* ==========================================================================
   HUSBAND RETAIL — PROGRAMME APP
   Built for one thing: Paul opens this on his phone and knows where the
   programme stands in about five seconds. iPhone first, big type, one idea
   per line. Detail is one tap away, never on the surface.
   ========================================================================== */
:root{
  --bg:#000000;
  --card:#18181B;
  --card-2:#26262B;
  --sep:rgba(255,255,255,.10);
  --sep-2:rgba(255,255,255,.16);
  /* every text colour below clears 4.5:1 on its own background — this gets
     read on a phone, outdoors, at arm's length */
  --tx:#FFFFFF;
  --tx-2:#AEAEB4;
  --tx-3:#8C8C93;

  --green:#3BE055;
  --blue:#57ADFF;
  /* light blue means one thing on the Timeline: a deliverable */
  --sky:#8FC9FF;
  --amber:#FFB930;
  --red:#FF6B61;
  --grey:#6E6E75;

  /* projected outcomes get their own colour on purpose. Nothing else in the
     app is violet, so a bright box can only mean one thing: this is what the
     work is supposed to produce, not work we have done. */
  --win:#CB8CFF;
  --win-2:#FF7FE3;
  --win-tx:#EFE0FF;
  --win-tx-2:#CDACE8;
  --win-bg:linear-gradient(140deg,rgba(203,140,255,.22) 0%,rgba(203,140,255,.10) 100%);
  --win-ring:rgba(203,140,255,.46);
  /* his own tracker is the only teal thing in the app */
  --teal:#3AD6C5; --teal-tx:#B8EDE6;
  /* orange is reserved for time — the month rail, and nothing else */
  --orange:#FF9230;

  --r:20px;
  --r-s:14px;
  --ease:cubic-bezier(.32,.72,0,1);
  --barh:52px;
  --chips-h:64px;
  --chiph:0px;
  --tabh:58px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:#000}
body{
  font-family:var(--font);background:var(--bg);color:var(--tx);
  font-size:18px;line-height:1.5;-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  /* clip, NOT hidden: overflow-x:hidden makes the body its own scroll
     container on iOS, which is what makes fixed bars drift mid-scroll and the
     page feel like it is fighting the finger. */
  overflow-x:clip;
  overscroll-behavior-y:none;
}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
[hidden]{display:none!important}
::-webkit-scrollbar{display:none}

/* the whole app sits in a phone-width column, centred if the screen is wider */
.app{max-width:460px;margin:0 auto;position:relative}

/* ------------------------------------------------------------- nav bar --- */
.bar{
  position:fixed;top:0;left:0;right:0;z-index:60;
  padding-top:env(safe-area-inset-top, 0px);
  background:#000;
  border-bottom:1px solid transparent;
  transition:border-color .3s var(--ease),background .3s var(--ease);
}
.bar.on{border-bottom-color:var(--sep)}
.bar-in{
  max-width:460px;margin:0 auto;height:var(--barh);position:relative;
  display:flex;align-items:center;justify-content:space-between;padding:0 20px;
}
.bar-t{
  position:absolute;left:0;right:0;text-align:center;
  font-size:16px;font-weight:600;letter-spacing:-.2px;
  opacity:0;transform:translateY(7px);
  transition:opacity .25s var(--ease),transform .25s var(--ease);
}
.bar.on .bar-t{opacity:1;transform:none}
.bar-c{
  font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--tx-3);
  transition:opacity .25s var(--ease);
}
/* the wordmark steps aside as the screen title takes the centre */
.bar.on .bar-c{opacity:0}
.bar-l{height:11px;width:auto;opacity:.62}

/* -------------------------------------------------------------- screens -- */
main{
  padding:calc(var(--barh) + env(safe-area-inset-top, 0px)) 22px
          calc(var(--tabh) + env(safe-area-inset-bottom, 0px) + 46px);
}
.scr{display:none}
.scr.on{display:block;animation:in .38s var(--ease) both}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* --------------------------------------------------------- large titles -- */
.lt{font-size:37px;font-weight:800;letter-spacing:-1.2px;line-height:1.2;padding:26px 0 0}
.lt-s{font-size:15.5px;color:var(--tx-2);margin-top:11px;letter-spacing:-.1px;line-height:1.45}
.grp{
  font-size:13.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--tx-3);margin:40px 0 13px 2px;
}

/* ---------------------------------------------------------------- cards -- */
.card{background:var(--card);border-radius:var(--r);padding:22px}
.card + .card{margin-top:12px}

/* hero — the one thing he reads first */
.hero{margin-top:26px;padding:28px 24px 30px;position:relative;overflow:hidden}
.hero .k{font-size:13.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--tx-3)}
.hero .v{font-size:40px;font-weight:800;letter-spacing:-1.4px;line-height:1.2;margin:15px 0 14px}
.hero .n{font-size:15.5px;color:var(--tx-2);line-height:1.5}
.hero.warn{background:linear-gradient(180deg,#261D09 0%,#1B1609 100%);box-shadow:inset 0 0 0 1px rgba(255,185,48,.26)}
.hero.warn .k{color:var(--amber)}

/* two tiles side by side */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.tile{
  background:var(--card);border-radius:var(--r);padding:20px 20px 22px;
  text-align:left;display:flex;flex-direction:column;min-height:150px;
  transition:transform .16s var(--ease),background .2s var(--ease);
}
.tile:active{transform:scale(.97);background:var(--card-2)}
.tile .k{font-size:13.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--tx-3);line-height:1.3}
.tile .v{font-size:46px;font-weight:800;letter-spacing:-2px;line-height:1;margin-top:auto}
.tile .v small{font-size:19px;font-weight:600;letter-spacing:-.4px}
.tile .n{font-size:15px;color:var(--tx-2);margin-top:9px;line-height:1.35}
.tile.alert .v{color:var(--amber)}
.tile.good .v{color:var(--green)}

/* ring */
.ring{display:flex;align-items:center;gap:16px;margin-top:auto}
.ring svg{width:58px;height:58px;flex:0 0 auto;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6;stroke-linecap:round}
.ring .t{stroke:rgba(255,255,255,.1)}
.ring .f{stroke:var(--green);transition:stroke-dashoffset 1.2s var(--ease) .2s}
.ring b{font-size:34px;font-weight:800;letter-spacing:-1.4px}

/* progress bar */
.pbar{display:block;height:7px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:14px}
.pbar i{display:block;height:100%;width:0;border-radius:4px;background:var(--green);transition:width 1.1s var(--ease) .15s}

/* ----------------------------------------------------------------- rows -- */
.rows{background:var(--card);border-radius:var(--r);overflow:hidden}
.row{
  width:100%;display:flex;align-items:center;gap:16px;text-align:left;
  padding:18px 20px;min-height:72px;position:relative;
  transition:background .16s var(--ease);
}
.row:active{background:var(--card-2)}
.row + .row:before{
  content:"";position:absolute;top:0;left:52px;right:0;height:1px;background:var(--sep);
}
.row.nodiv + .row:before,.row + .row.nodiv:before{left:20px}
.row .dot{flex:0 0 auto;width:12px;height:12px;border-radius:50%;background:var(--grey);margin-left:2px}
.row .dot.done{background:var(--green)}
.row .dot.active{background:var(--blue);box-shadow:0 0 0 4px rgba(10,132,255,.18)}
.row .dot.wait{background:var(--amber);box-shadow:0 0 0 4px rgba(255,176,32,.16)}
.row .dot.block{background:var(--red);box-shadow:0 0 0 4px rgba(255,69,58,.16)}
.row .mid{flex:1;min-width:0;display:block}
.row .t{display:block;font-size:18px;font-weight:500;letter-spacing:-.3px;line-height:1.32}
.row .s{display:block;font-size:15px;color:var(--tx-3);margin-top:6px;line-height:1.35}
.row .r{flex:0 0 auto;display:block;text-align:right;font-size:15px;font-weight:600;color:var(--tx-3);letter-spacing:-.1px}
.row .chev{flex:0 0 auto;width:8px;height:8px;border:solid var(--tx-3);border-width:2px 2px 0 0;transform:rotate(45deg);margin-left:2px}
.row.big .t{font-size:18px;font-weight:600;letter-spacing:-.4px}

/* status word on the right of a row */
.st{font-size:13.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.st.done{color:var(--green)} .st.active{color:var(--blue)}
.st.wait{color:var(--amber)} .st.block{color:var(--red)} .st.todo{color:var(--tx-3)}

/* pill */
.pill{
  display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  padding:4px 9px;border-radius:7px;background:rgba(255,255,255,.08);color:var(--tx-2);
}
.pill.red{background:rgba(255,69,58,.16);color:var(--red)}
.pill.amber{background:rgba(255,176,32,.16);color:var(--amber)}
.pill.blue{background:rgba(10,132,255,.18);color:#5AB0FF}
.pill.green{background:rgba(50,215,75,.16);color:var(--green)}

/* ------------------------------------------------------- project filter -- */
/* the filter stays under the top bar as he scrolls, so he can always see
   which project he is looking at and change it without scrolling back up */
.chips{
  position:sticky;top:calc(var(--barh) + env(safe-area-inset-top, 0px));z-index:40;
  display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;
  margin:24px -22px 0;padding:13px 22px 14px;
  background:#000;
  height:var(--chips-h);align-items:center;
  border-bottom:1px solid var(--sep);
}
.chip{
  flex:0 0 auto;scroll-snap-align:center;
  display:inline-flex;align-items:center;min-height:48px;
  padding:0 20px;border-radius:100px;background:var(--card);
  font-size:15px;font-weight:500;letter-spacing:-.2px;color:var(--tx);white-space:nowrap;
  transition:background .2s var(--ease),color .2s var(--ease),transform .14s var(--ease);
}
.chip:active{transform:scale(.94)}
.chip.on{background:var(--tx);color:#000;font-weight:600}
.chip b{font-weight:inherit;opacity:.55;margin-left:7px}
.chip.on b{opacity:.45}

/* ---------------------------------------------------------- timeline ----
   No phases. A month rail in orange, the high-level work in white under it,
   every deliverable in light blue. Three levels, three colours, three gap
   sizes — the SPACING is what makes it navigable, not boxes. Nothing in this
   list has a shadow, a transition or a background: a list this long has to be
   cheap to paint or the scroll stutters. */
.tl-m{
  position:sticky;z-index:35;
  top:calc(var(--barh) + env(safe-area-inset-top, 0px) + var(--chiph, 0px));
  margin:46px -22px 0;padding:13px 22px 11px;background:#000;
  display:flex;align-items:baseline;gap:12px;
  font-size:13px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
  color:var(--orange);border-bottom:1px solid rgba(255,146,48,.24);
}
.tl-m.f{margin-top:20px}
.tl-m b{margin-left:auto;font-size:14px;font-weight:600;letter-spacing:.01em;
  text-transform:none;color:#E0913F}
/* Off-screen months are skipped entirely — but only once their real height is
   known. A guessed height changes the length of the page as he scrolls, which
   is the very thing this is meant to stop, so tlMeasure() switches it on after
   measuring rather than up front. */
.tl-t{display:flex;align-items:baseline;gap:12px;margin:32px 2px 4px;
  font-size:20px;font-weight:700;letter-spacing:-.45px;line-height:1.25;color:#FFFFFF}
.tl-g > .tl-t:first-child{margin-top:22px}
.tl-t b{margin-left:auto;font-size:14px;font-weight:600;color:var(--tx-3);
  font-variant-numeric:tabular-nums}
/* one hairline binds a deliverable to the work above it — cheaper to paint
   than a card, a border and a background, and quieter to read */
.tl-l{margin-left:3px;padding-left:15px;border-left:1px solid rgba(143,201,255,.22)}
.tl-d{display:flex;width:100%;gap:14px;align-items:flex-start;text-align:left;
  padding:12px 2px;min-height:48px}
.tl-d:active{opacity:.55}
.tl-x{flex:1 1 auto;font-size:16.5px;line-height:1.4;letter-spacing:-.1px;color:var(--sky)}
.tl-d .st{flex:0 0 auto;margin-top:3px}
.tl-o{margin-top:14px}
/* the sticky month sits under the filter strip only while the strip is there */
#scr-plan{--chiph:var(--chips-h)}
#scr-plan.nochips{--chiph:0px}
/* the tracker carries the same month bands, so it needs the same sticky offset */
#scr-track{--chiph:var(--chips-h)}
/* its rows are cards, not one-line deliverables, so the lane drops the rule
   and gives them room to breathe instead */
.tl-l.tk-lane{border-left:0;padding-left:0;margin-left:0;
  display:flex;flex-direction:column;gap:12px;margin-top:12px}
.note{font-size:15px;color:var(--tx-3);line-height:1.55;margin:26px 2px 0}

/* ---------------------------------------------- projected outcome boxes -- */
.out{
  display:block;width:100%;text-align:left;position:relative;
  margin-top:10px;padding:21px 22px 23px;border-radius:var(--r);
  background:var(--win-bg);
  box-shadow:inset 0 0 0 1.5px var(--win-ring),0 10px 34px -18px rgba(203,140,255,.75);
  transition:transform .16s var(--ease),box-shadow .25s var(--ease);
}
.out:active{transform:scale(.985);box-shadow:inset 0 0 0 1.5px var(--win),0 10px 34px -16px rgba(203,140,255,.9)}
.out .k{
  display:flex;align-items:center;gap:9px;
  font-size:13.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--win);
}
.out .k i{
  flex:0 0 auto;width:9px;height:9px;background:var(--win);transform:rotate(45deg);
  border-radius:2px;box-shadow:0 0 14px var(--win);
}
.out .t{display:block;font-size:20.5px;font-weight:700;letter-spacing:-.55px;line-height:1.22;margin-top:14px;color:#fff}
.out .d{display:block;font-size:15px;color:var(--win-tx);line-height:1.5;margin-top:11px}
.out .f{
  display:flex;align-items:center;gap:9px;margin-top:16px;
  font-size:15px;font-weight:600;color:var(--win-tx-2);letter-spacing:-.1px;
}
.out .f .chev{border-color:var(--win);width:7px;height:7px;border-width:2px 2px 0 0;transform:rotate(45deg)}
.out.unver .k{color:var(--amber)}
.out.unver .k i{background:var(--amber);box-shadow:0 0 14px var(--amber)}

/* the tick box that strips the timeline back to outcomes only */
.tick{
  display:flex;align-items:center;gap:16px;width:100%;text-align:left;
  margin-top:18px;padding:18px 20px;border-radius:var(--r);background:var(--card);
  transition:background .2s var(--ease),box-shadow .3s var(--ease),transform .14s var(--ease);
}
.tick:active{transform:scale(.99)}
.tick.on{background:var(--win-bg);box-shadow:inset 0 0 0 1.5px var(--win-ring)}
.tick .bx{
  flex:0 0 auto;position:relative;width:27px;height:27px;border-radius:9px;
  border:2px solid var(--tx-3);
  transition:background .2s var(--ease),border-color .2s var(--ease);
}
.tick.on .bx{background:var(--win);border-color:var(--win)}
.tick .bx:after{
  content:"";position:absolute;left:8px;top:3.5px;width:6px;height:12px;
  border:solid #250B36;border-width:0 2.6px 2.6px 0;transform:rotate(42deg) scale(.4);
  opacity:0;transition:opacity .18s var(--ease),transform .24s var(--ease);
}
.tick.on .bx:after{opacity:1;transform:rotate(42deg) scale(1)}
.tick .mid{flex:1;min-width:0}
.tick .t{display:block;font-size:16.5px;font-weight:600;letter-spacing:-.3px;line-height:1.3}
.tick .s{display:block;font-size:15px;color:var(--tx-3);margin-top:5px;line-height:1.35}
.tick.on .s{color:var(--win-tx-2)}
.tick .n{
  flex:0 0 auto;font-size:15px;font-weight:700;color:var(--tx-3);
}
.tick.on .n{color:var(--win)}

/* ==================================================== dashboard (cockpit) ==
   One screen, read standing up, in ten seconds. Everything stacks vertically,
   everything is big, and the colour of the top box IS the answer — green only
   when there is genuinely nothing for him to do. */
.dash{display:flex;flex-direction:column;gap:22px;margin-top:8px}
.dash-k{
  font-size:13.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  color:var(--tx-3);margin:0 2px 16px;
}

/* the verdict. This is the whole screen in one box. */
.vd{
  border-radius:26px;padding:34px 26px 36px;text-align:left;width:100%;display:block;
  transition:transform .16s var(--ease);
}
.vd:active{transform:scale(.985)}
.vd .k{display:block;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.72}
.vd .v{display:block;font-size:50px;font-weight:800;letter-spacing:-2.2px;line-height:1.2;margin:20px 0 18px}
.vd .n{display:block;font-size:18px;line-height:1.48;opacity:.9;max-width:30ch}
.vd .f{display:flex;align-items:center;gap:9px;margin-top:24px;font-size:15px;font-weight:700;opacity:.85}
.vd .f .chev{width:8px;height:8px;border-style:solid;border-width:2px 2px 0 0;transform:rotate(45deg)}
.vd.ok{background:linear-gradient(155deg,#1F8F3C 0%,#0E6B2C 100%);color:#EAFFEF;
  box-shadow:0 22px 60px -30px rgba(59,224,85,.85),inset 0 0 0 1.5px rgba(120,255,150,.3)}
.vd.ok .f .chev{border-color:#EAFFEF}
.vd.you{background:linear-gradient(155deg,#3A2A08 0%,#241B08 100%);color:#FFE7BC;
  box-shadow:inset 0 0 0 1.5px rgba(255,185,48,.36)}
.vd.you .k,.vd.you .v{color:var(--amber)}
.vd.you .f .chev{border-color:var(--amber)}
.vd.stop{background:linear-gradient(155deg,#3B1512 0%,#26100E 100%);color:#FFD8D4;
  box-shadow:inset 0 0 0 1.5px rgba(255,107,97,.4)}
.vd.stop .k,.vd.stop .v{color:var(--red)}
.vd.stop .f .chev{border-color:var(--red)}

/* one action, one project, three steps — all the same card grammar */
.big{
  display:block;width:100%;text-align:left;background:var(--card);
  border-radius:22px;padding:26px 24px 28px;
  transition:transform .16s var(--ease),background .2s var(--ease);
}
.big:active{transform:scale(.985);background:var(--card-2)}
.big .k{display:block;font-size:13.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--tx-3)}
.big .v{display:block;font-size:30px;font-weight:800;letter-spacing:-1.1px;line-height:1.2;margin-top:16px}
.big .v.sm{font-size:25px;letter-spacing:-.85px}
.big .n{display:block;font-size:15.5px;color:var(--tx-2);line-height:1.5;margin-top:14px}
.big .f{display:flex;align-items:center;gap:9px;margin-top:22px;font-size:15px;font-weight:700;color:var(--blue)}
.big .f .chev{width:8px;height:8px;border:solid var(--blue);border-width:2px 2px 0 0;transform:rotate(45deg)}
.big.act{box-shadow:inset 0 0 0 1.5px rgba(87,173,255,.42)}
.big.act .k{color:var(--blue)}

/* the three steps, numbered, big enough to read at arm's length */
.step{
  display:flex;align-items:flex-start;gap:20px;width:100%;text-align:left;
  background:var(--card);border-radius:22px;padding:24px 22px;margin-bottom:12px;
  transition:transform .16s var(--ease),background .2s var(--ease);
}
.step:active{transform:scale(.985);background:var(--card-2)}
.step .no{
  flex:0 0 auto;width:40px;height:40px;border-radius:14px;background:rgba(255,255,255,.07);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:800;color:var(--tx-2);letter-spacing:-.5px;
}
.step .mid{flex:1;min-width:0}
.step .t{display:block;font-size:19px;font-weight:600;letter-spacing:-.45px;line-height:1.28}
.step .s{display:block;font-size:15px;color:var(--tx-3);margin-top:9px;line-height:1.4}
.step.you .no{background:rgba(255,185,48,.18);color:var(--amber)}

/* what changed since he last looked */
.chg{
  border-radius:22px;padding:24px 22px 26px;
  background:linear-gradient(150deg,rgba(87,173,255,.16) 0%,rgba(87,173,255,.05) 100%);
  box-shadow:inset 0 0 0 1.5px rgba(87,173,255,.3);
}
.chg .k{font-size:13.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--blue)}
.chg ul{margin-top:16px;list-style:none}
.chg li{font-size:17px;line-height:1.45;color:var(--tx);padding-left:20px;position:relative;margin-top:12px}
.chg li:before{content:"";position:absolute;left:0;top:8px;width:8px;height:8px;border-radius:50%;background:var(--blue)}
.chg .n{font-size:15px;color:var(--tx-2);margin-top:18px;line-height:1.45}

/* a decision he can actually answer */
.dq{
  display:block;width:100%;text-align:left;border-radius:22px;padding:24px 22px 26px;
  background:linear-gradient(150deg,rgba(255,185,48,.15) 0%,rgba(255,185,48,.04) 100%);
  box-shadow:inset 0 0 0 1.5px rgba(255,185,48,.32);margin-bottom:12px;
  transition:transform .16s var(--ease);
}
.dq:active{transform:scale(.985)}
.dq .k{display:block;font-size:13.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--amber)}
.dq .t{display:block;font-size:20px;font-weight:700;letter-spacing:-.5px;line-height:1.25;margin-top:14px}
.dq .f{display:flex;align-items:center;gap:9px;margin-top:18px;font-size:15px;font-weight:700;color:var(--amber)}
.dq .f .chev{width:8px;height:8px;border:solid var(--amber);border-width:2px 2px 0 0;transform:rotate(45deg)}
.dq.answered{background:rgba(59,224,85,.09);box-shadow:inset 0 0 0 1.5px rgba(59,224,85,.3)}
.dq.answered .k,.dq.answered .f{color:var(--green)}
.dq.answered .f .chev{border-color:var(--green)}

/* his drafted answer, in the sheet */
.ans button{
  display:block;width:100%;text-align:left;padding:20px 18px;border-radius:var(--r-s);
  background:var(--card);margin-bottom:10px;font-size:17px;font-weight:500;letter-spacing:-.3px;
  line-height:1.35;transition:transform .14s var(--ease),box-shadow .2s var(--ease);
}
.ans button:active{transform:scale(.985)}
.ans button.sel{box-shadow:inset 0 0 0 1.5px var(--amber);background:rgba(255,185,48,.12)}


/* =================================================== his own task tracker ==
   The other screens report what WE say. This one is his: he sets the status,
   it saves on his phone, and it never overwrites what we publish. The whole
   screen is tinted teal so the difference is visible before it is read. */
.tk-note{
  margin-top:18px;padding:16px 18px;border-radius:var(--r-s);
  background:rgba(58,214,197,.10);box-shadow:inset 0 0 0 1px rgba(58,214,197,.22);
  font-size:16px;line-height:1.5;color:var(--teal-tx);
}
.tk-hero{
  margin-top:14px;padding:24px 22px 26px;border-radius:var(--r);
  background:linear-gradient(150deg,rgba(58,214,197,.20) 0%,rgba(58,214,197,.06) 100%);
  box-shadow:inset 0 0 0 1.5px rgba(58,214,197,.34);
}
.tk-hero .k{font-size:13.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--teal)}
.tk-hero .ring{margin-top:18px}
.tk-hero .ring .f{stroke:var(--teal)}
.tk-hero .ring b{font-size:40px}
.tk-hero .n{font-size:15px;color:var(--teal-tx);margin-top:16px;line-height:1.45}
.tk-saved{font-size:15px;color:var(--tx-3);margin-top:14px;line-height:1.4}

/* The collapsible "Phase N" header that used to live here is gone. The tracker
   is grouped by month now, by the same code the Timeline uses, so the two can
   never disagree about what a thing is or when it happens. */

/* A tracker row is a Timeline row that can be ticked. It used to be a boxed
   card carrying its own project name and a "What this is" button — but the
   project name is now the heading directly above it, and tapping the title
   already opens the detail, so both were repeating themselves 80 times over.
   As cards the screen ran to about 17,000px; as rows it is a third of that. */
.tkc{
  display:flex;flex-wrap:wrap;align-items:flex-start;gap:10px 14px;
  width:100%;padding:9px 2px;position:relative;
}
.tkc.mine{padding-left:13px}
.tkc.mine::before{
  content:"";position:absolute;left:0;top:11px;bottom:11px;width:2.5px;
  border-radius:2px;background:var(--teal);
}
.tkc[data-s="done"]{opacity:.6}
.tkc[data-s="done"] .tkc-t{text-decoration:line-through;text-decoration-color:var(--tx-3)}
.tkc-t{
  flex:1 1 150px;min-height:48px;display:flex;align-items:center;
  text-align:left;border:0;background:none;padding:0;cursor:pointer;
  font:400 16.5px/1.4 var(--font);letter-spacing:-.1px;color:var(--sky);
}
.tkc-t:active{opacity:.55}
.tkc-s{
  flex:1 0 100%;font-size:13.5px;color:var(--teal-tx);line-height:1.35;
  margin-top:-4px;font-style:italic;
}
.tkc-s:empty{display:none}
.stc{
  flex:0 0 auto;
  display:inline-flex;align-items:center;gap:9px;min-height:48px;
  padding:0 15px;border-radius:100px;background:rgba(255,255,255,.07);
  font-size:14.5px;font-weight:600;letter-spacing:-.2px;color:var(--tx);
  transition:background .18s var(--ease),transform .14s var(--ease);
}
.stc:active{transform:scale(.95)}
.stc .dot{width:11px;height:11px;border-radius:50%;background:var(--grey);flex:0 0 auto}
.stc[data-s="done"]{background:rgba(59,224,85,.16);color:var(--green)}
.stc[data-s="done"] .dot{background:var(--green)}
.stc[data-s="active"]{background:rgba(87,173,255,.16);color:var(--blue)}
.stc[data-s="active"] .dot{background:var(--blue)}
.stc[data-s="waiting"]{background:rgba(255,185,48,.16);color:var(--amber)}
.stc[data-s="waiting"] .dot{background:var(--amber)}
.stc[data-s="blocked"]{background:rgba(255,107,97,.16);color:var(--red)}
.stc[data-s="blocked"] .dot{background:var(--red)}
.tkc.bump{animation:bump .34s var(--ease)}
@keyframes bump{0%{transform:scale(1)}42%{transform:scale(1.022)}100%{transform:scale(1)}}

/* the status chooser, as a set of big rows in the sheet */
.pk{margin-top:20px}
.pk button{
  display:flex;align-items:center;gap:15px;width:100%;text-align:left;
  padding:19px 18px;border-radius:var(--r-s);background:var(--card);margin-bottom:9px;
  font-size:17.5px;font-weight:500;letter-spacing:-.3px;
  transition:background .16s var(--ease),transform .14s var(--ease);
}
.pk button:active{transform:scale(.985)}
.pk button .dot{width:14px;height:14px;border-radius:50%;background:var(--grey);flex:0 0 auto}
.pk button[data-s="done"] .dot{background:var(--green)}
.pk button[data-s="active"] .dot{background:var(--blue)}
.pk button[data-s="waiting"] .dot{background:var(--amber)}
.pk button[data-s="blocked"] .dot{background:var(--red)}
.pk button .ok{margin-left:auto;color:var(--teal);font-size:15px;font-weight:700}
.pk button.sel{box-shadow:inset 0 0 0 1.5px rgba(58,214,197,.5)}
.ours{font-size:15px;color:var(--tx-3);margin:6px 2px 0;line-height:1.5}
.ours b{color:var(--tx-2);font-weight:600}

/* export / reset */
.tk-tools{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:26px}
.tk-tools button{
  padding:19px 16px;border-radius:var(--r);background:var(--card);
  font-size:16px;font-weight:600;letter-spacing:-.3px;color:var(--tx);
  transition:transform .14s var(--ease),background .18s var(--ease);
}
.tk-tools button:active{transform:scale(.97);background:var(--card-2)}
.tk-tools button.go{background:rgba(58,214,197,.16);color:var(--teal)}
.sh-out{
  width:100%;margin-top:18px;min-height:230px;resize:none;
  background:#000;border-radius:var(--r-s);border:1px solid var(--sep);
  /* 16px is not a taste. Anything under it makes iOS Safari zoom the page the
     moment the field is focused, and he then has to pinch back out to see the
     Send button. */
  padding:16px;color:var(--tx-2);font-size:16px;line-height:1.5;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
}
/* The message box holds prose, not an answer to be copied out, so it drops the
   monospace and reads at full strength. */
.sh-out.msg-tx{font-family:var(--font);color:var(--tx);font-size:17px;min-height:180px}
.sh-go{
  display:block;width:100%;margin-top:14px;padding:19px;border-radius:var(--r);
  background:var(--teal);color:#04302B;font-size:17px;font-weight:700;letter-spacing:-.3px;
}
.spark{position:fixed;z-index:120;width:8px;height:8px;border-radius:2px;pointer-events:none}

/* ------------------------------------------------------------ empty ------ */
.empty{background:var(--card);border-radius:var(--r);padding:34px 24px;text-align:center;color:var(--tx-2);font-size:15.5px}
.empty button{margin-top:14px;color:var(--blue);font-weight:600}

/* --------------------------------------------------------- message us --- */
/* A message reaches us from anywhere in the app. The circle is white so the
   Slack mark keeps its own four colours — those colours are the logo, not app
   status, and the white disc is what keeps them from reading as one. It rides
   above the tab bar and gets out of the way whenever a sheet or a picture is
   open. */
.msg-b{
  position:fixed;z-index:66;width:56px;height:56px;border-radius:50%;
  right:max(14px, calc(50vw - 216px));
  bottom:calc(var(--tabh) + env(safe-area-inset-bottom, 0px) + 18px);
  display:flex;align-items:center;justify-content:center;
  background:#FFFFFF;color:#0A0A0C;border:0;cursor:pointer;
  box-shadow:0 6px 22px -8px rgba(0,0,0,.9);
}
.msg-b:active{opacity:.7}
.msg-b svg{width:27px;height:27px;display:block}
body.sheeting .msg-b,body.gviewing .msg-b{display:none}
.msg-s{display:block;width:100%;margin-top:14px;min-height:56px;border:0;border-radius:16px;
  background:#FFFFFF;color:#0A0A0C;font:700 17px/1 var(--font);letter-spacing:-.2px;cursor:pointer}
.msg-s:active{opacity:.72}
.msg-s[disabled]{opacity:.45;cursor:default}
.msg-e{margin-top:12px;font-size:15px;line-height:1.45;color:var(--amber)}
.msg-ok{font-size:17px;line-height:1.5;color:var(--green)}

/* ------------------------------------------------------------- tab bar --- */
.tabs{
  position:fixed;bottom:0;left:0;right:0;z-index:70;
  background:#000;
  border-top:1px solid var(--sep);
  padding-bottom:env(safe-area-inset-bottom, 0px);
}
.tabs-in{max-width:460px;margin:0 auto;display:flex}
.tabs button{
  flex:1;height:var(--tabh);position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font-size:10.5px;font-weight:600;letter-spacing:.01em;color:var(--tx-3);
  transition:color .22s var(--ease),transform .14s var(--ease);
}
.tabs button:active{transform:scale(.9)}
/* Where you are, in the app's own blue. Project+ is black and this blue; the
   selected tab is the one place a person looks to answer "where am I", so it
   gets the brand colour rather than a second shade of white. */
.tabs button.on{color:var(--blue)}
.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabs .bdg{
  position:absolute;top:6px;left:50%;margin-left:6px;min-width:17px;height:17px;padding:0 5px;
  border-radius:9px;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;
  line-height:17px;text-align:center;letter-spacing:0;
}
.tabs .bdg.tk-bdg{background:var(--teal);color:#04302B}

/* --------------------------------------------------------------- sheet --- */
.scrim{
  position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.6);
  opacity:0;pointer-events:none;transition:opacity .32s var(--ease);
}
body.sheeting .scrim{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:90;
  max-width:460px;margin:0 auto;max-height:88vh;
  display:flex;flex-direction:column;
  background:#1C1C20;border-radius:18px 18px 0 0;
  transform:translateY(102%);transition:transform .44s var(--ease);
  overscroll-behavior:contain;
}
body.sheeting .sheet{transform:none}
.grip{flex:0 0 auto;width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.22);margin:9px auto 2px}
.sheet-in{
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:14px 24px calc(30px + env(safe-area-inset-bottom, 0px));
}
.sh-k{font-size:13.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:14px}
.sh-t{font-size:26px;font-weight:800;letter-spacing:-.8px;line-height:1.2;margin-bottom:14px}
.sh-d{font-size:17px;color:var(--tx-2);line-height:1.55}
.sh-n{
  font-size:15px;line-height:1.5;color:#FFD79A;margin-top:16px;
  background:rgba(255,185,48,.11);border-radius:var(--r-s);padding:14px 16px;
}
.sh-w{
  font-size:16px;line-height:1.5;color:var(--win-tx);margin-top:16px;
  background:rgba(203,140,255,.13);border-radius:var(--r-s);padding:14px 16px;
  box-shadow:inset 0 0 0 1px rgba(203,140,255,.24);
}
.sh-meta{margin-top:22px;border-top:1px solid var(--sep)}
.sh-meta div{display:flex;gap:16px;padding:13px 0;border-bottom:1px solid var(--sep)}
.sh-meta dt{flex:0 0 112px;font-size:15px;color:var(--tx-3);font-weight:500}
.sh-meta dd{flex:1;font-size:15px;line-height:1.4}
.sh-list{margin-top:20px}
.sh-list .row{padding:14px 0;min-height:0;background:none}
.sh-list .row + .row:before{left:0}
.sh-ul{list-style:none;margin-top:6px}
.sh-ul li{font-size:15.5px;line-height:1.45;padding:12px 0 12px 20px;position:relative;border-bottom:1px solid var(--sep)}
.sh-ul li:last-child{border-bottom:none}
.sh-ul li:before{content:"";position:absolute;left:2px;top:19px;width:6px;height:6px;border-radius:50%;background:var(--tx-3)}
.sh-ul li b{display:block;font-weight:600;margin-bottom:3px}
.sh-ul li span{color:var(--tx-2);font-size:16px}
.sh-x{
  width:100%;margin-top:24px;padding:16px;border-radius:14px;
  background:var(--card-2);font-size:16px;font-weight:600;letter-spacing:-.2px;
  transition:transform .14s var(--ease);
}
.sh-x:active{transform:scale(.98)}

/* ------------------------------------------------------------- footer ---- */
.foot{margin:34px 2px 0;font-size:15px;color:var(--tx-3);line-height:1.65}
.foot img{height:13px;width:auto;opacity:.55;display:block;margin-bottom:14px}

@media (prefers-reduced-motion: reduce){
  *,*:before,*:after{animation-duration:.001ms!important;transition-duration:.001ms!important}
}
/* a desktop visitor gets the phone app, centred, on a plain dark field */
@media (min-width:520px){
  body{background:#09090B}
  .app{box-shadow:0 0 0 1px rgba(255,255,255,.06)}
}

/* ---- the year on one chart ------------------------------------------- */
/* The thumbnail is a preview, not a reading surface. Everything that has to
   be read at phone size is real text around it; the picture itself is a
   stripped-back render whose labels are set large enough to survive the
   shrink. Tapping it opens the full chart. */
.gc{background:var(--card);border-radius:var(--r);padding:22px 20px 20px;overflow:hidden}
.gc-k{font-size:13.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--orange)}
.gc-t{margin-top:9px;font-size:26px;line-height:1.2;font-weight:700;letter-spacing:-.6px;color:var(--tx)}
.gc-s{margin-top:8px;font-size:16px;line-height:1.5;color:var(--tx-2)}
 /* a preview of a document, cropped and faded rather than shrunk whole: at
    full height it pushed the Timeline's phases below the fold. The crop keeps
    the title and the first two blocks; the button underneath does the rest. */
.gc-i{position:relative;display:block;width:calc(100% + 40px);margin:18px -20px 0;
  padding:0;border:0;aspect-ratio:1/1.25;max-height:430px;overflow:hidden;
  background:#FAF8F3;cursor:pointer;-webkit-tap-highlight-color:transparent}
.gc-i img{display:block;width:100%;height:auto}
.gc-i::after{content:"";position:absolute;left:0;right:0;bottom:0;height:132px;
  background:linear-gradient(180deg,rgba(250,248,243,0) 0%,
    rgba(250,248,243,.90) 58%,#FAF8F3 100%);pointer-events:none}
.gc-i:active{opacity:.72}
.gc-a{display:flex;gap:10px;margin-top:16px}
.gc-b{flex:1 1 0;display:inline-flex;align-items:center;justify-content:center;
  min-height:52px;padding:0 12px;border:0;border-radius:14px;
  background:var(--card-2);color:var(--tx);
  font:600 16px/1.2 var(--font);letter-spacing:-.2px;text-align:center;
  text-decoration:none;cursor:pointer}
.gc-b:active{opacity:.7}
.gc-b.p{background:var(--orange);color:#180A00}

/* the full chart, over everything, at its own size */
.gv{position:fixed;inset:0;z-index:80;background:#000;display:none}
body.gviewing .gv{display:block}
body.gviewing{overflow:hidden}
.gv-s{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;
  display:flex;align-items:center;justify-content:flex-start}
.gv-s img{display:block;width:var(--gvw,1240px);max-width:none;height:auto;flex:0 0 auto}
.gv-s.fit img{width:100%}
.gv-x{position:absolute;right:14px;z-index:2;
  top:calc(14px + env(safe-area-inset-top,0px));
  min-height:48px;min-width:48px;padding:0 20px;border:0;border-radius:100px;
  background:#1E1E22;
  color:var(--tx);font:600 16px/1 var(--font);cursor:pointer}
.gv-h{position:absolute;left:16px;right:16px;z-index:2;
  bottom:calc(14px + env(safe-area-inset-bottom,0px));
  text-align:center;font-size:15px;color:var(--tx-3);pointer-events:none}

/* ------------------------------------------------------------- the deck -- */
/* six finished pages, one under the other. They run full-bleed so they read
   as plates rather than thumbnails, and each one keeps its own background —
   these are documents sitting on the app, not part of it. */
.dk{margin:26px -20px 0}
.dk-p{margin-top:34px}
.dk-p:first-child{margin-top:22px}
.dk-n{display:flex;align-items:baseline;gap:10px;padding:0 20px 12px}
.dk-n b{flex:0 0 auto;font-size:13.5px;font-weight:800;letter-spacing:.12em;color:var(--orange)}
.dk-n span{font-size:16.5px;font-weight:600;line-height:1.3;color:var(--tx-2);letter-spacing:-.1px}
.dk-i{display:block;width:100%;padding:0;border:0;background:#0B0B0D;
  cursor:pointer;-webkit-tap-highlight-color:transparent}
.dk-i img{display:block;width:100%;height:auto}
.dk-i:active{opacity:.72}

/* ============================================== THE COCKPIT (Dashboard) == */
/* Four blocks, in this order and no other: how the programme is doing, what
   starts first, what is next, and the roadmap. It is meant to be read at a
   glance from across a desk, so the first two blocks are solid colour rather
   than text — the colour IS the message and the words only name it. */
.ec-k{font-size:12.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  color:var(--tx-3);margin:34px 0 13px}

/* the status readout: one filled block, one word. Worked out from the data
   every time the screen is built, and the whole block is the way through to
   whatever needs doing about it. */
.ec-st{display:flex;flex-direction:column;align-items:center;justify-content:center;
  width:100%;min-height:138px;text-align:center;border:0;padding:26px 22px;
  border-radius:var(--r);background:var(--sc);color:#0A1206;position:relative;
  overflow:hidden;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ec-st.green{--sc:var(--green)}
.ec-st.amber{--sc:var(--amber)}
.ec-st.red{--sc:var(--red)}
.ec-st:active{filter:brightness(.92)}
.ec-st .w{display:block;font-size:34px;font-weight:800;letter-spacing:-.9px;
  line-height:1.1;text-transform:uppercase}
.ec-st .n{display:block;margin-top:10px;font-size:14px;line-height:1.4;opacity:.7}
/* the tap affordance is a shape, not another line of words */
.ec-st .c{position:absolute;top:15px;right:17px;width:11px;height:11px;opacity:.5;
  border-right:2.5px solid currentColor;border-top:2.5px solid currentColor;
  transform:rotate(45deg)}

/* what starts first. `flex:1 1 150px` is what makes the last row fill the
   width instead of leaving one block orphaned on its own line. */
.ec-bx{display:flex;flex-wrap:wrap;gap:10px}
.ec-bx button{flex:1 1 150px;display:flex;align-items:flex-end;min-height:92px;
  text-align:left;border:0;padding:15px 16px;border-radius:16px;
  background:var(--green);color:#0A1206;cursor:pointer;
  font:800 19px/1.2 var(--font);letter-spacing:-.35px;
  -webkit-tap-highlight-color:transparent}
.ec-bx button:active{filter:brightness(.92)}

/* next milestones: a bordered card per project, the project ruled off at the
   top, the week window on the right of each line */
.ec-ms{background:var(--card);border:1px solid var(--sep-2);border-radius:var(--r);
  overflow:hidden}
.ec-ms + .ec-ms{margin-top:10px}
.ec-msh{margin:17px 18px 3px;padding-bottom:10px;border-bottom:1.5px solid var(--sep-2);
  font-size:17px;font-weight:700;letter-spacing:-.2px;color:var(--tx)}
.ec-mi{display:flex;width:100%;gap:14px;align-items:flex-start;text-align:left;border:0;
  background:none;padding:13px 18px;min-height:48px;cursor:pointer;
  -webkit-tap-highlight-color:transparent}
.ec-mi + .ec-mi{border-top:1px solid var(--sep)}
.ec-mi:active{background:var(--card-2)}
.ec-mi .t{flex:1 1 auto;font-size:15.5px;line-height:1.35;color:var(--tx)}
.ec-mi .y{display:block;margin-top:3px;font-size:13px;color:var(--amber)}
/* orange is time everywhere else in this app, and a week number is time */
.ec-mi .w{flex:0 0 auto;font-size:13.5px;font-weight:600;font-style:italic;
  color:var(--orange);font-variant-numeric:tabular-nums;padding-top:2px}
.ec-mn{margin-top:10px;font-size:13px;line-height:1.4;color:var(--tx-3)}
/* the roadmap on this screen is the document itself: no kicker, no heading,
   no paragraph — the picture carries its own title. */
.gc.bare{margin-top:14px;padding-top:20px}
.gc.bare .gc-i{margin-top:0}

/* ======================================================= SIGN IN (Project+)
   The screen in front of everything else. It is deliberately the plainest
   thing in the app: one column, one decision at a time, nothing to read that
   is not either a label or a way in. A person arriving here is not browsing,
   they are trying to get to their programme.

   While this is up, the app underneath is not merely covered — it is empty.
   The programme has not been fetched yet, so there is nothing behind this to
   see through, screenshot, or find in the page source. */
body.pp-locked .app{display:none}
body.pp-locked{overflow:hidden}

.gate{position:fixed;inset:0;z-index:120;background:var(--bg);
  display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;
  padding:calc(env(safe-area-inset-top) + 8vh) 20px calc(env(safe-area-inset-bottom) + 40px)}
.gate[hidden]{display:none}
.gate-in{width:100%;max-width:360px}

.gate-mark{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.02em;color:var(--tx)}
.gate-mark span{color:var(--blue)}
.gate-sub{margin-top:8px;font-size:17px;line-height:1.55;color:var(--tx-2)}

.gate-body{margin-top:28px}

/* Google's own button. It has to look like Google's button — people are
   looking for the shape they already know, not for our version of it. */
.gate-g{min-height:44px}
.gate-g > div{margin:0 auto}
.gate-gnote{margin-top:10px;font-size:13.5px;line-height:1.5;color:var(--tx-3)}

.gate-or{display:flex;align-items:center;gap:14px;margin:22px 0 4px;
  font-size:13.5px;color:var(--tx-3)}
.gate-or::before,.gate-or::after{content:"";flex:1 1 auto;height:1px;background:var(--sep)}

.gate-f{margin-top:18px}
.gate-l{display:block;margin-bottom:7px;font-size:15px;font-weight:400;color:var(--tx-2)}
.gate-i{width:100%;height:52px;padding:0 14px;font-family:var(--font);font-size:17px;
  color:var(--tx);background:var(--card);border:1px solid var(--sep-2);border-radius:12px;
  -webkit-appearance:none;appearance:none}
.gate-i:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(87,173,255,.25)}
.gate-i.bad{border-color:var(--red)}
.gate-pw{position:relative}
.gate-pw .gate-i{padding-right:74px}
.gate-see{position:absolute;right:4px;top:4px;height:44px;padding:0 12px;
  font-size:15px;color:var(--tx-2)}
.gate-hint{margin-top:7px;font-size:13.5px;line-height:1.45;color:var(--tx-3)}

.gate-go{width:100%;height:56px;margin-top:22px;border-radius:14px;
  font-size:17px;font-weight:600;color:#00131f;background:var(--blue)}
.gate-go:disabled{opacity:.55}
.gate-go.quiet{margin-top:12px;height:52px;font-weight:500;color:var(--tx);
  background:var(--card);border:1px solid var(--sep-2)}

/* The project somebody has just found. A confirmation, not a menu — there is
   only ever one, and the only thing to do with it is join. The mark is shown at
   40px against a native 60, so it is scaled down rather than up and stays sharp. */
.gate-card{display:flex;align-items:center;gap:14px;margin-top:22px;padding:14px 16px;
  background:var(--card);border:1px solid var(--sep-2);border-radius:14px}
.gate-card img{flex:0 0 auto;width:auto;height:40px}
.gate-card-t{min-width:0}
.gate-card-b{display:block;font-size:16.5px;font-weight:600;line-height:1.3;color:var(--tx);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gate-card-p{display:block;margin-top:2px;font-size:15px;line-height:1.35;color:var(--tx-2)}
.gate-none{margin-top:16px;font-size:15px;line-height:1.5;color:var(--tx-3)}

.gate-alt{margin-top:20px;text-align:center;font-size:15.5px;line-height:1.6;color:var(--tx-2)}
.gate-alt button{color:var(--blue);font-size:inherit;text-decoration:underline;
  text-underline-offset:3px;text-decoration-thickness:1px;padding:6px 4px}

/* An error has to be readable as an error without relying on the colour, so it
   carries a word as well as a red edge. */
.gate-err{margin-top:18px;padding:13px 14px;border-radius:12px;font-size:15.5px;line-height:1.5;
  color:#FFD9D5;background:rgba(255,107,97,.13);border:1px solid rgba(255,107,97,.42)}
.gate-err b{display:block;font-weight:600;color:var(--red);margin-bottom:2px}
.gate-ok{margin-top:18px;padding:13px 14px;border-radius:12px;font-size:15.5px;line-height:1.5;
  color:#CFF3D6;background:rgba(59,224,85,.12);border:1px solid rgba(59,224,85,.38)}
.gate-ok b{display:block;font-weight:600;color:var(--green);margin-bottom:2px}

.gate-wait{margin-top:26px;font-size:16px;color:var(--tx-3)}

/* Whose app this is, said once and said properly. This is the negative
   artwork — the real asset drawn for a black surface, white wordmark, mark
   keeping its gradient. The shortcut we used before was the ordinary logo with
   a CSS invert on top, which flattens that gradient into a solid block: a logo
   nobody at Digital Movement ever drew.

   ALIGNMENT. The logo, the words and every field below share one left edge.
   The drawing carries a little empty space of its own on the left, so it is
   pulled back by exactly that much — otherwise it sits a few pixels in from
   everything under it, which reads as a mistake even when nobody can say why. */
.gate-top{margin:0 0 32px}
.gate-by{font-size:13.5px;line-height:1.4;letter-spacing:.01em;color:var(--tx-3);margin-bottom:10px}
.gate-logo{display:block;width:280px;max-width:82%;height:auto;margin:0}

/* The way out, at the bottom of "You" — where a person looks for it, and far
   enough from everything else that it is never the button you meant. */
.pp-out{margin:26px 4px 8px;padding-top:20px;border-top:1px solid var(--sep)}
.pp-out .who{font-size:15px;line-height:1.5;color:var(--tx-3)}
.pp-out button{margin-top:12px;height:48px;padding:0 20px;border-radius:12px;
  font-size:16px;color:var(--tx);background:var(--card);border:1px solid var(--sep-2)}
</style>
</head>
