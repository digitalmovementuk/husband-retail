<script>
/* The programme used to sit in data.js next to this file. It does not any more.
   That file was in a public repository, so "the app" and "the world" could read
   exactly the same thing. Everything below now waits: the sign-in screen runs
   first, fetches the programme from our own server, puts it on window.TRACKER,
   and only then calls this. */
window.__pplusBoot = function(){
  "use strict";

  var T = TRACKER, M = T.meta;
  var ms = T.milestones;
  var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ------------------------------------------------------------- helpers */
  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function el(tag, cls, html){
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html !== undefined) n.innerHTML = html;
    return n;
  }

  var STATUS = {
    done:   { label:"Done",     cls:"done"   },
    active: { label:"Under way",cls:"active" },
    waiting:{ label:"You",      cls:"wait"   },
    blocked:{ label:"Blocked",  cls:"block"  },
    todo:   { label:"To do",    cls:"todo"   }
  };
  function st(k){ return STATUS[k] || STATUS.todo; }

  var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  function parse(d){ var a = d.split("-"); return new Date(+a[0], +a[1]-1, +a[2]); }
  function fmt(d){ return d.getDate() + " " + MONTHS[d.getMonth()] + " " + d.getFullYear(); }
  function addDays(d, n){ var x = new Date(d.getTime()); x.setDate(x.getDate()+n); return x; }

  /* ------------------------------------------------- dates come from one date */
  var start = parse(M.termStart);
  var today = new Date(); today.setHours(0,0,0,0);
  var started = today >= start;
  var firm = !!M.termStartFirm;

  T.phases.forEach(function(p){
    p.startDate = addDays(start, (p.from - 1) * 7);
    p.endDate   = addDays(start, p.to * 7 - 1);
    p.weeks     = "Weeks " + p.from + "–" + p.to;
    p.range     = fmt(p.startDate) + " – " + fmt(p.endDate);
  });

  /* The month rail. Phases are gone from the Timeline, so the reader navigates
     by calendar instead — and two groups must never claim the same month or the
     rail stops being a rail. Each one starts at the first month the group before
     it did not already take. Worked out once, at boot, so no filter can move it. */
  (function rail(){
    var used = -1;
    var nm = function(i){ return MONTHS[i % 12] + " " + Math.floor(i / 12); };
    T.phases.forEach(function(p){
      var ai = p.startDate.getFullYear() * 12 + p.startDate.getMonth();
      var bi = p.endDate.getFullYear()   * 12 + p.endDate.getMonth();
      if (ai <= used) ai = used + 1;
      if (ai > bi) ai = bi;
      used = bi;
      p.rail = ai === bi ? nm(ai)
             : Math.floor(ai / 12) === Math.floor(bi / 12)
                 ? MONTHS[ai % 12] + " – " + nm(bi)
                 : nm(ai) + " – " + nm(bi);
    });
  })();

  /* The agreement fixes phases, not individual dates. A month heading is the
     calendar window its phase runs in — never an invented date for one item. */
  function monthSpan(p){
    var a = p.startDate, b = p.endDate;
    var am = MONTHS[a.getMonth()], bm = MONTHS[b.getMonth()];
    var ay = a.getFullYear(), by = b.getFullYear();
    if (am === bm && ay === by) return am + " " + ay;
    if (ay === by) return am + " – " + bm + " " + ay;
    return am + " " + ay + " – " + bm + " " + by;
  }

  var phaseNow = null, phaseIdx = -1;
  if (started){
    for (var i = 0; i < T.phases.length; i++){
      if (today >= T.phases[i].startDate && today <= T.phases[i].endDate){
        phaseNow = T.phases[i]; phaseIdx = i; break;
      }
    }
    if (!phaseNow && today > T.phases[T.phases.length-1].endDate) phaseIdx = T.phases.length;
  }
  function monthOfTerm(){
    if (!started) return 0;
    var m = (today.getFullYear() - start.getFullYear()) * 12 + (today.getMonth() - start.getMonth());
    if (today.getDate() < start.getDate()) m -= 1;
    return Math.min(M.termMonths, m + 1);
  }

  function pillarOf(k){ return T.pillars.filter(function(p){ return p.key === k; })[0]; }
  function phaseOf(id){ return T.phases.filter(function(p){ return p.id === id; })[0]; }

  /* ------------------------------------------------------------- counters */
  var count = { done:0, active:0, waiting:0, blocked:0, todo:0 };
  ms.forEach(function(m){ count[m.s] = (count[m.s]||0) + 1; });
  var pct = ms.length ? Math.round(count.done / ms.length * 100) : 0;

  var openDec = T.decisions.filter(function(d){ return d.s !== "done"; });
  var blockers = openDec.filter(function(d){ return d.blocker; });
  var openDecNums = {};
  openDec.forEach(function(d){ openDecNums[d.n] = true; });
  var extraWaiting = ms.filter(function(m){
    return (m.s === "waiting" || m.s === "blocked") && !(m.dec && openDecNums[m.dec]);
  });
  var outstanding = openDec.length + extraWaiting.length;

  /* ================================================================ SHEET */
  var scrim = $("scrim"), sheet = $("sheet"), sheetIn = $("sheetIn");

  function closeSheet(){
    document.body.classList.remove("sheeting");
    sheet.style.transform = "";
  }
  function openSheet(html){
    sheetIn.innerHTML = html + '<button type="button" class="sh-x">Close</button>';
    sheetIn.scrollTop = 0;
    sheetIn.querySelector(".sh-x").addEventListener("click", closeSheet);
    document.body.classList.add("sheeting");
  }
  scrim.addEventListener("click", closeSheet);
  document.addEventListener("keydown", function(e){ if (e.key === "Escape") closeSheet(); });

  /* drag the sheet down to dismiss it */
  (function(){
    var y0 = null, dy = 0, t0 = 0;
    sheet.addEventListener("touchstart", function(e){
      if (sheetIn.scrollTop > 0) return;
      y0 = e.touches[0].clientY; t0 = Date.now(); dy = 0;
      sheet.style.transition = "none";
    }, { passive:true });
    sheet.addEventListener("touchmove", function(e){
      if (y0 === null) return;
      dy = e.touches[0].clientY - y0;
      if (dy > 0) sheet.style.transform = "translateY(" + dy + "px)";
    }, { passive:true });
    sheet.addEventListener("touchend", function(){
      if (y0 === null) return;
      sheet.style.transition = "";
      sheet.style.transform = "";
      if (dy > 90 || (dy > 30 && dy / Math.max(1, Date.now() - t0) > .5)) closeSheet();
      y0 = null;
    });
  })();

  function metaRow(k, v){ return "<div><dt>" + esc(k) + "</dt><dd>" + esc(v) + "</dd></div>"; }

  function milestoneSheet(m){
    var s = st(m.s), ph = phaseOf(m.ph), pil = pillarOf(m.p);
    var own = m.o === "HR" ? "Husband Retail" : (m.o === "DM" ? "Digital Movement" : "Both of us");
    openSheet(
      '<div class="sh-k st ' + s.cls + '">' + esc(s.label === "You" ? "Waiting on you" : s.label) + '</div>' +
      '<h2 class="sh-t">' + esc(m.t) + '</h2>' +
      '<p class="sh-d">' + esc(m.d) + '</p>' +
      (m.note ? '<div class="sh-n">' + esc(m.note) + '</div>' : '') +
      '<dl class="sh-meta">' +
        metaRow("Project", pil.id + " " + pil.name) +
        metaRow("Phase", "Phase " + ph.n + " · " + ph.name) +
        metaRow("When", monthSpan(ph) + (firm ? "" : " · provisional")) +
        metaRow("Who does it", own) +
        metaRow("In the agreement", m.ref) +
      '</dl>');
  }

  function decisionSheet(d){
    var holds = ms.filter(function(m){ return m.dec === d.n; })
                  .map(function(m){ return pillarOf(m.p); })
                  .filter(function(p, i, a){ return p && a.indexOf(p) === i; })
                  .map(function(p){ return p.id + " " + p.name; });
    var settled = d.s === "done";
    openSheet(
      '<div class="sh-k ' + (settled ? "st done" : d.blocker ? "st block" : "st wait") + '">' +
        (settled ? "Decided" : d.blocker ? "Blocks Phase 1" : "Needed " +
          (/^Phase/.test(d.by) ? "in " + d.by : d.by)) + '</div>' +
      '<h2 class="sh-t">' + esc(d.q) + '</h2>' +
      '<p class="sh-d">' +
        (settled
          ? (d.answer ? "Answer on record: " + esc(d.answer) : "Settled.")
          : d.blocker
            ? "Phase 1 cannot close until this is answered."
            : "We need this by " + esc(/^Phase/.test(d.by) ? d.by.toLowerCase() : d.by) + ".") +
      '</p>' +
      (holds.length ? '<div class="sh-n">Holds up ' + esc(holds.join(" and ")) + '.</div>' : '') +
      '<dl class="sh-meta">' + metaRow("Decision", d.n) +
        metaRow("Needed", d.blocker ? "Before Phase 1 can close" : d.by) + '</dl>');
  }

  function projectSheet(p){
    var list = ms.filter(function(m){ return m.p === p.key; });
    var done = list.filter(function(m){ return m.s === "done"; }).length;
    var rows = list.map(function(m){
      var s = st(m.s);
      return '<button type="button" class="row" data-m="' + ms.indexOf(m) + '">' +
        '<span class="dot ' + s.cls + '"></span>' +
        '<span class="mid"><span class="t">' + esc(m.t) + '</span></span>' +
        '<span class="st ' + s.cls + '">' + esc(s.label) + '</span></button>';
    }).join("");
    openSheet(
      '<div class="sh-k" style="color:var(--tx-3)">Project ' + esc(p.id) + '</div>' +
      '<h2 class="sh-t">' + esc(p.name) + '</h2>' +
      '<p class="sh-d">' + esc(p.does) + '</p>' +
      '<div class="ph-c"><div class="pbar"><i style="width:' +
        (list.length ? Math.round(done/list.length*100) : 0) + '%"></i></div>' +
        '<span>' + done + ' of ' + list.length + '</span></div>' +
      '<div class="sh-list">' + rows + '</div>');
  }

  function textSheet(kicker, title, body){
    openSheet('<div class="sh-k" style="color:var(--tx-3)">' + esc(kicker) + '</div>' +
              '<h2 class="sh-t">' + esc(title) + '</h2>' + body);
  }

  /* a tap anywhere on a milestone row opens that milestone */
  document.addEventListener("click", function(e){
    var r = e.target.closest ? e.target.closest("[data-m]") : null;
    if (r) milestoneSheet(ms[+r.dataset.m]);
  });

  /* =============================================================== ROWS == */
  /* "To do" is the default state of almost everything, so printing it 80 times
     is noise. The grey dot says it. Only exceptions get a word. */
  function msRow(m, showProject){
    var s = st(m.s), pil = pillarOf(m.p);
    var b = el("button","row");
    b.type = "button";
    b.dataset.m = ms.indexOf(m);
    b.innerHTML =
      '<span class="dot ' + s.cls + '"></span>' +
      '<span class="mid"><span class="t">' + esc(m.t) + '</span>' +
        (showProject ? '<span class="s">' + esc(pil.name) + '</span>' : '') +
      '</span>' +
      (m.s === "todo" ? '<span class="chev"></span>'
                      : '<span class="st ' + s.cls + '">' + esc(s.label) + '</span>');
    return b;
  }

  /* ============================================================ NOW ====== */
  /* ==================================================== DASHBOARD (cockpit)
     Four blocks and no more: how the programme is doing, what starts first,
     what is next, and the roadmap. It is read at a glance from across a desk,
     so the first two blocks are solid colour rather than text — the colour is
     the message and the words only name it. Everything on it is worked out
     from data.js when the screen is built; nothing here is typed in by hand. */


  /* ----------------------------------------------------------- the verdict */
  function verdict(){
    var stopped = ms.filter(function(m){ return m.s === "blocked"; });
    if (stopped.length)
      return { cls:"stop", k:"Attention", v:"Something<br>is stuck",
        n: stopped.length + (stopped.length === 1 ? " thing is" : " things are") +
           " blocked and cannot move until it is cleared.",
        f:"See what is blocked", go:"you" };
    if (!M.contractSigned)
      return { cls:"you", k:"Not started", v:"Waiting on<br>your signature",
        n:"Nothing has started. Every date here is calculated from a provisional kick-off of " +
          fmt(start) + " and moves the day you sign.",
        f:"What happens first", go:"plan" };
    if (outstanding)
      return { cls:"you", k:"Needs you", v:outstanding + " thing" + (outstanding === 1 ? "" : "s") + "<br>need you",
        n: (blockers.length ? blockers.length + " of them hold up Phase 1. " : "") +
           "Everything else is ours and running.",
        f:"See what they are", go:"you" };
    if (phaseIdx >= T.phases.length)
      return { cls:"ok", k:"Term complete", v:"Twelve months<br>delivered",
        n:"The initial term ended " + fmt(T.phases[T.phases.length-1].endDate) + ".",
        f:"See the year", go:"plan" };
    return { cls:"ok", k:"On track", v:"All good.<br>Nothing for you",
      n:"Every open item is ours. Nothing is waiting on you and nothing is blocked.",
      f:"See what we are on", go:"plan" };
  }

  /* the single most important thing HE has to do, or nothing */
  function yourMove(){
    if (!M.contractSigned)
      return { k:"Your move", v:"Sign the agreement",
        n:"Twelve months, " + esc(M.fee) + ". Nothing starts until it is countersigned, and every date moves with it.",
        f:"Read the terms",
        go:function(){
          textSheet("The agreement", "What you are signing",
            '<p class="sh-d">' + esc(M.programme) + " — " + esc(M.termMonths) +
            " months at " + esc(M.fee) + ", " + esc(M.total) + " in total.</p>" +
            '<dl class="sh-meta">' +
              metaRow("Issued", fmt(parse(M.contractIssued))) +
              metaRow("Signed", "Not yet") +
              metaRow("Kick-off", fmt(start) + (firm ? "" : " · provisional")) +
              metaRow("Term", M.termMonths + " months") + '</dl>'); } };
    if (blockers.length)
      return { k:"Your move", v:"Answer " + blockers.length + " question" + (blockers.length === 1 ? "" : "s"),
        n:"Phase 1 cannot close until these are settled. You can answer them here.",
        f:"Answer them now", go:function(){ go("dash"); var d = $("scr-dash").querySelector(".dq");
          if (d && d.scrollIntoView) d.scrollIntoView({ block:"center", behavior: reduced ? "auto" : "smooth" }); } };
    if (outstanding)
      return { k:"Your move", v:outstanding + " thing" + (outstanding === 1 ? "" : "s") + " waiting",
        n:"None of them hold up the current phase, but all are needed.",
        f:"See the list", go:function(){ go("you"); } };
    return null;
  }

  /* ====================================================== THE DASHBOARD ==
     The cockpit. Four blocks, in this order and no other:
       1  Project status        one word, computed, never typed by hand
       2  Currently working on  what is actually running
       3  Next milestones       what happens next, in week numbers
       4  The roadmap           drawn in HTML, not embedded as a picture

     There is not one image on this screen. The roadmap is built from the same
     `roadmap` block in data.js that draws the printable chart, so the two can
     never say different things. */

  /* Week numbers, because that is how the plan is read. Programme week 1 begins
     on meta.termStart, and 1 Sep 2026 happens to be calendar week 36 — which is
     where the w36 in the plan comes from. Nothing here is typed in by hand. */
  function isoWeek(d){
    var t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    t.setDate(t.getDate() + 3 - ((t.getDay() + 6) % 7));
    var w1 = new Date(t.getFullYear(), 0, 4);
    return 1 + Math.round(((t - w1) / 864e5 - 3 + ((w1.getDay() + 6) % 7)) / 7);
  }
  /* The agreement fixes phases, not individual dates, so a milestone shows the
     window its phase runs in. A single invented week would read as a booked
     date for something nobody has booked. */
  function weekSpan(p){
    var a = isoWeek(p.startDate), b = isoWeek(p.endDate);
    return a === b ? "w" + a : "w" + a + "–" + b;
  }

  /* The status word is worked out from the data every time this screen is
     built. It is deliberately about SCHEDULE and nothing else: a question
     sitting with Husband Retail is not a slipped programme, and colouring it
     red would cry wolf. Anything unresolved is named in the line underneath. */
  function status(){
    var blocked = ms.filter(function(m){ return m.s === "blocked"; }).length;
    var stuck   = openDec.filter(function(d){ return d.blocker && !myAnswer(d); }).length;
    var late    = phaseIdx >= T.phases.length && ms.filter(function(m){ return m.s !== "done"; }).length;

    if (blocked)
      return { cls:"red", w:"Blocked", go:"work",
        n: blocked + (blocked === 1 ? " thing is" : " things are") + " stopped" };

    if (late)
      return { cls:"amber", w:"Overrunning", go:"work",
        n: late + " deliverable" + (late === 1 ? "" : "s") + " not signed off" };

    if (started && stuck)
      return { cls:"amber", w:"Needs attention", go:"you",
        n: stuck + " question" + (stuck === 1 ? "" : "s") + " holding up Phase 1" };

    return { cls:"green", w:"As planned", go: stuck ? "you" : "work",
      n: started
           ? "Month " + monthOfTerm() + " of " + M.termMonths
           : "Starts " + fmt(start) + (firm ? "" : " · provisional until signed") };
  }

  /* "Currently working on" has to mean exactly that. Before the programme
     starts nothing is under way, and the app must not dress up what is coming
     as what is happening — so the heading itself changes. */
  function workingOn(){
    var live = ms.filter(function(m){ return m.s === "active"; });
    var ph   = phaseNow || T.phases[Math.max(0, phaseIdx)] || T.phases[0];
    var set  = live.length ? live : ms.filter(function(m){ return m.ph === ph.id && m.s !== "done"; });
    var tally = {};
    set.forEach(function(m){ tally[m.p] = (tally[m.p] || 0) + 1; });
    return {
      live:  !!live.length,
      head:  live.length ? "Currently working on" : "Starting first",
      note:  live.length
               ? set.length + (set.length === 1 ? " thing is" : " things are") + " under way."
               : "Nothing is under way yet. This is Phase " + ph.n + ", " + esc(ph.name).toLowerCase() +
                 ", " + weekSpan(ph) + ".",
      phase: ph,
      keys:  Object.keys(tally).sort(function(a, b){ return tally[b] - tally[a]; }),
      tally: tally
    };
  }

  function buildDash(){
    var box = $("scr-dash");
    box.innerHTML = "";
    box.appendChild(el("h1","lt","Dashboard"));

    /* 1 ─ project status: one filled block, one word */
    box.appendChild(el("div","ec-k","Project status"));
    var st = status();
    var sb = el("button","ec-st " + st.cls,
      '<span class="w">' + esc(st.w) + '</span>' +
      '<span class="n">' + esc(st.n) + '</span><span class="c"></span>');
    sb.type = "button";
    sb.addEventListener("click", function(){ go(st.go); });
    box.appendChild(sb);

    /* 2 ─ what is running, as blocks */
    var wo = workingOn();
    box.appendChild(el("div","ec-k", wo.head));
    var bx = el("div","ec-bx");
    wo.keys.slice(0, 2).forEach(function(k){
      var pr = pillarOf(k);
      var b  = el("button", "", esc(pr.short));
      b.type = "button";
      b.addEventListener("click", function(){ projectSheet(pr); });
      bx.appendChild(b);
    });
    box.appendChild(bx);

    /* 3 ─ next milestones */
    box.appendChild(el("div","ec-k","Next milestones"));
    var shown = 0;
    wo.keys.slice(0, 2).forEach(function(k){
      var list = ms.filter(function(m){
        return m.p === k && m.ph === wo.phase.id && m.s !== "done"; }).slice(0, 3);
      if (!list.length) return;
      shown += list.length;
      var card = el("div","ec-ms",
        '<div class="ec-msh">' + esc(pillarOf(k).name) + '</div>');
      list.forEach(function(m){
        var yours = m.o === "HR" || m.s === "waiting";
        var b = el("button","ec-mi",
          '<span class="t">' + esc(m.t) +
            (yours ? '<span class="y">Waiting on you</span>' : '') + '</span>' +
          '<span class="w">' + esc(weekSpan(phaseOf(m.ph))) + '</span>');
        b.type = "button";
        b.addEventListener("click", function(){ milestoneSheet(m); });
        card.appendChild(b);
      });
      box.appendChild(card);
    });
    /* the one line of prose on this screen. Without it a week number reads as a
       booked date, and no individual date has been booked. */
    if (shown)
      box.appendChild(el("p","ec-mn",
        "Weeks are the window the phase runs in, not a booked date."));

    /* 4 ─ the roadmap, as the document it is */
    box.appendChild(ganttCard(true));

    box.appendChild(el("div","foot",
      '<img src="assets/dm-logo-negative.svg" alt="Digital Movement">' +
      "Every line in this app comes from the service agreement issued " +
      fmt(parse(M.contractIssued)) + ". Nothing is marked done until it has been signed off.<br>" +
      "Last updated " + fmt(parse(M.lastUpdated)) + " by " + esc(M.updatedBy) + "."));

    var dq = openDec.filter(function(d){ return !myAnswer(d); }).length;
    $("dashBadge").textContent = dq;
    $("dashBadge").hidden = !dq;
  }

  /* ------------------------------------------- answering a decision in-app -
     He picks, it saves on his phone, and the wording is written for him to
     copy into a reply. It does NOT reach us on its own — nothing here is sent
     anywhere — so the sheet says that in as many words. */
  var AKEY = "hr-answers-v1";
  var answers = {};
  try{ answers = JSON.parse(window.localStorage.getItem(AKEY) || "{}"); }catch(e){ answers = {}; }
  function myAnswer(d){ return answers[d.n] || ""; }
  function saveAnswer(d, text){
    if (text) answers[d.n] = text; else delete answers[d.n];
    try{ window.localStorage.setItem(AKEY, JSON.stringify(answers)); }catch(e){}
  }

  function answerSheet(d){
    var picked = myAnswer(d);
    var opts = (d.options && d.options.length) ? d.options : null;
    var html =
      '<div class="sh-k st ' + (d.blocker ? "block" : "wait") + '">Decision ' + esc(d.n) +
        (d.blocker ? " · holds up Phase 1" : "") + '</div>' +
      '<h2 class="sh-t">' + esc(d.q) + '</h2>' +
      '<p class="sh-d">Needed ' + esc(d.blocker ? "before Phase 1 can close" : d.by) + '.</p>';

    if (opts){
      html += '<div class="ans">' + opts.map(function(o){
        return '<button type="button" data-a="' + esc(o) + '"' +
          (o === picked ? ' class="sel"' : '') + '>' + esc(o) + '</button>'; }).join("") + '</div>';
    } else {
      html += '<div class="ans"><textarea class="sh-out" id="ansTx" ' +
        'placeholder="Type your answer"></textarea></div>';
    }
    html += '<button type="button" class="sh-go" id="ansGo">' +
      (picked ? "Copy your answer" : "Save and copy") + '</button>' +
      '<p class="ours">This is saved on your phone only. It does not reach us on its own — ' +
      'paste it into your reply so we can act on it.</p>' +
      (picked ? '<p class="ours"><b>You said:</b> ' + esc(picked) + '</p>' : '');
    openSheet(html);

    var chosen = picked;
    Array.prototype.forEach.call(sheetIn.querySelectorAll(".ans button[data-a]"), function(b){
      b.addEventListener("click", function(){
        Array.prototype.forEach.call(sheetIn.querySelectorAll(".ans button[data-a]"), function(x){
          x.classList.remove("sel"); });
        b.classList.add("sel");
        chosen = b.dataset.a;
      });
    });

    $("ansGo").addEventListener("click", function(){
      var tx = $("ansTx");
      if (tx) chosen = tx.value.trim();
      if (!chosen) return;
      saveAnswer(d, chosen);
      var line = "Decision " + d.n + " — " + d.q + "\n" + chosen +
                 "\n\n(Husband Retail, " + fmt(today) + ")";
      var b = $("ansGo");
      var done = function(){ b.textContent = "Copied — now paste it to us"; buzz(12);
        setTimeout(function(){ closeSheet(); buildDash(); }, 900); };
      if (navigator.clipboard && navigator.clipboard.writeText)
        navigator.clipboard.writeText(line).then(done, done);
      else done();
    });
  }

  /* =================================================== THE ROADMAP CARD == */
  /* One builder, used by both the Dashboard and the Timeline, so the two can
     never drift apart. Two renders of the same roadmap exist:
       roadmap.svg       the roadmap alone — the thumbnail and the viewer
       roadmap-full.svg  the same, plus the indicative values — download only
     The values are what each project would cost commissioned on its own. They
     are not what Husband Retail pays, so they stay off every screen.
     Both are drawn from data.js by build-roadmap.js. Rerun it after any edit. */
  /* AB is where the confidential pictures come from. Signed in, it points at
     our server and carries the session, so the roadmap is no more public than
     the words are. Left as it is, it points at the folder beside this file —
     which is how the app still opens when you are working on it locally. */
  var AB = (window.PPLUS && window.PPLUS.assetBase) || "assets/";
  var ROADMAP = { view:AB + "roadmap.svg", dl:AB + "roadmap-full.svg",
                  w:1240, h:1680,
                  name:"Husband-Retail-Project-Roadmap-2026-2027" };

  /* the card's own words. The picture already carries the document's title, so
     these say what the card is FOR, not what it is called. */
  var CARD = {
    kicker: "The plan",
    title:  "What happens, and when",
    sub:    "Each bar is one part of the work and the months it runs, " +
            "September 2026 to December 2027. Dates are provisional until " +
            "the agreement is signed."
  };

  function ganttCard(bare){
    var c = el("div", bare ? "gc bare" : "gc",
      (bare ? '' :
        '<div class="gc-k">' + esc(CARD.kicker) + '</div>' +
        '<h2 class="gc-t">' + esc(CARD.title) + '</h2>' +
        '<p class="gc-s">' + esc(CARD.sub) + '</p>') +
      '<button type="button" class="gc-i">' +
        /* not lazy: the Timeline's copy is built while that screen is hidden, so
           a lazy image would arrive as a blank rectangle the first time he opens
           the tab, and this is the first thing on that screen. */
        '<img src="' + ROADMAP.view + '" width="' + ROADMAP.w + '" height="' + ROADMAP.h + '" ' +
        'alt="Project roadmap: seven workstreams from September 2026 to December 2027, ' +
        'each shown as a bar across the months it runs">' +
      '</button>' +
      '<div class="gc-a">' +
        '<button type="button" class="gc-b p" data-g="v">Open full size</button>' +
        '<button type="button" class="gc-b" data-g="d">Download</button>' +
      '</div>');
    c.querySelector(".gc-i").addEventListener("click", openGantt);
    c.querySelector('[data-g="v"]').addEventListener("click", openGantt);
    c.querySelector('[data-g="d"]').addEventListener("click", function(){
      ganttDownload(this);
    });
    return c;
  }

  /* One viewer for every full-size picture in the app — the roadmap card and
     all six pages of the Overview. It opens fitted to the screen; a tap
     switches to the picture's own size so he can move around inside it, which
     is the only way the small print in these pages is readable on a phone.
     The picture's own width is handed in, because they are not all the same. */
  var VW_FIT = "Tap the picture to see it full size",
      VW_BIG = "Drag to move around · tap to fit the screen";

  function openViewer(src, alt, w){
    var i = $("gvI"), box = $("gvS");
    if (i.getAttribute("src") !== src) i.src = src;
    i.alt = alt;
    box.style.setProperty("--gvw", w + "px");
    box.classList.add("fit");
    box.scrollLeft = 0; box.scrollTop = 0;
    $("gvH").textContent = VW_FIT;
    document.body.classList.add("gviewing");
    buzz(8);
  }
  function closeViewer(){ document.body.classList.remove("gviewing"); }
  function openGantt(){
    openViewer(ROADMAP.view, "Project Roadmap 2026 to 2027, full size", ROADMAP.w);
  }

  (function(){
    $("gvX").addEventListener("click", closeViewer);
    /* fit to the screen first, so he sees the whole page; tap for actual size
       and drag around. Two states, the way a photo behaves. */
    $("gvI").addEventListener("click", function(){
      var box = $("gvS"), fit = box.classList.toggle("fit");
      $("gvH").textContent = fit ? VW_FIT : VW_BIG;
      if (!fit){ box.scrollLeft = 0; box.scrollTop = 0; }
    });
    document.addEventListener("keydown", function(e){
      if (e.key === "Escape" && document.body.classList.contains("gviewing")) closeViewer();
    });
  })();

  /* The download is a PNG at twice the chart's own size, because an SVG opens
     rather than saves on an iPhone. If the browser will not rasterise it, the
     SVG itself is handed over instead — it loses nothing but the file type. */
  function ganttDownload(btn){
    var was = btn.textContent;
    btn.disabled = true; btn.textContent = "Preparing…";
    var restore = function(){ btn.disabled = false; btn.textContent = was; };
    var save = function(href, name){
      var a = document.createElement("a");
      a.href = href; a.download = name; a.rel = "noopener";
      document.body.appendChild(a); a.click(); a.remove(); buzz(12);
    };
    var plain = function(){ save(ROADMAP.dl, ROADMAP.name + ".svg"); restore(); };

    var img = new Image();
    img.onload = function(){
      try{
        var w = img.naturalWidth || ROADMAP.w, h = img.naturalHeight || ROADMAP.h, k = 2;
        var cv = document.createElement("canvas");
        cv.width = w * k; cv.height = h * k;
        var cx = cv.getContext("2d");
        cx.fillStyle = "#FAF8F3"; cx.fillRect(0, 0, cv.width, cv.height);
        cx.drawImage(img, 0, 0, cv.width, cv.height);
        cv.toBlob(function(b){
          if (!b) return plain();
          var u = URL.createObjectURL(b);
          save(u, ROADMAP.name + ".png");
          setTimeout(function(){ URL.revokeObjectURL(u); }, 8000);
          restore();
        }, "image/png");
      }catch(e){ plain(); }
    };
    img.onerror = plain;
    img.src = ROADMAP.dl;
  }

  /* ============================================================ OVERVIEW == */
  /* Six finished pages, in the order they were drawn. Every page prints its
     own title inside the artwork, so the line above it says what the page is
     FOR instead of repeating the title.

     Pages 4 and 5 are the same six steps twice, illustrated and then plain.
     That is how the deck was handed over; if one of them goes, delete the row.

     The last page is the roadmap, and it is the SAME file the Dashboard and
     the Timeline show. There is only ever one roadmap in this app, and its
     size is read from ROADMAP so it cannot fall out of step with the picture. */
  var DECK = {
    h1:  "The programme in six pages",
    sub: "Scroll from the cover to the roadmap, and tap any page to open it full size.",
    pages: [
      { f:AB + "deck/01-cover.webp", w:941, h:1672,
        t:"Sets the scene",
        a:"Cover: Husband Retail, the integrated digital sales engine, project portfolio and roadmap 2026 to 2027" },
      { f:AB + "deck/02-portfolio.webp", w:941, h:1672,
        t:"What's in the programme",
        a:"Project portfolio: the five projects split into inbound and outbound, each with its deliverables" },
      { f:AB + "deck/03-funnel.webp", w:941, h:1672,
        t:"How the engine fits together",
        a:"Sales funnel: four sources of demand feeding the website, and below it qualified leads, strategic conversations and new mandates" },
      { f:AB + "deck/04-engine.webp", w:941, h:1672,
        t:"From build to win",
        a:"Six numbered steps, from building the website through to winning new mandates, drawn as an illustration" },
      { f:AB + "deck/05-engine-flat.webp", w:941, h:1672,
        t:"The same steps, drawn plain",
        a:"The same six steps, from building the website through to winning new mandates, drawn as a plain diagram" },
      { f:ROADMAP.view, w:ROADMAP.w, h:ROADMAP.h,
        t:"When each project runs",
        a:"Project roadmap: seven workstreams from September 2026 to December 2027, each shown as a bar across the months it runs" }
    ]
  };

  function buildOverview(){
    var box = $("scr-overview");
    box.innerHTML = "";
    box.appendChild(el("h1","lt", DECK.h1));
    box.appendChild(el("p","lt-s", DECK.sub));

    var deck = el("div","dk");
    DECK.pages.forEach(function(p, n){
      var no = ("0" + (n + 1)).slice(-2);
      /* only the first page loads up front. The rest arrive as he scrolls to
         them, which keeps opening the tab cheap on a phone; every one reserves
         its own box first, so nothing jumps as they land. */
      var row = el("div","dk-p",
        '<div class="dk-n"><b>' + no + '</b><span>' + esc(p.t) + '</span></div>' +
        '<button type="button" class="dk-i">' +
          '<img src="' + p.f + '" width="' + p.w + '" height="' + p.h + '" ' +
          (n ? 'loading="lazy" ' : '') + 'alt="' + esc(p.a) + '">' +
        '</button>');
      row.querySelector(".dk-i").addEventListener("click", function(){
        openViewer(p.f, p.a + ", full size", p.w);
      });
      deck.appendChild(row);
    });
    box.appendChild(deck);
  }

  /* =========================================================== TIMELINE == */
  var pillar = "all";
  var outsOnly = false;
  /* every tab opens fully collapsed — the overview first, detail on request */

  var OUTS = T.outcomes || [];
  var OUT_NOTE = T.outcomesNote ||
    "Projected, not promised. The agreement does not guarantee a commercial result.";

  function outsIn(phaseId){
    return OUTS.filter(function(o){ return o.phase === phaseId; });
  }

  /* A projected outcome is not a deliverable and must never be mistaken for one.
     It gets its own colour, its own word — "projected" — and the disclaimer
     travels with it into the detail sheet. */
  function outcomeBox(o){
    var b = el("button","out" + (o.verified === false ? " unver" : ""));
    b.type = "button";
    b.innerHTML =
      '<span class="k"><i></i>Projected · ' + esc(o.when) + '</span>' +
      '<span class="t">' + esc(o.title) + '</span>' +
      '<span class="d">' + esc(o.detail) + '</span>' +
      '<span class="f">' + (o.verified === false ? "Not verified · what this rests on" : "What this rests on") +
        '<span class="chev"></span></span>';
    b.addEventListener("click", function(){ outcomeSheet(o); });
    return b;
  }

  function outcomeSheet(o){
    var ph = phaseOf(o.phase);
    openSheet(
      '<div class="sh-k" style="color:var(--win)">Projected outcome · ' + esc(o.when) + '</div>' +
      '<h2 class="sh-t">' + esc(o.title) + '</h2>' +
      '<p class="sh-d">' + esc(o.detail) + '</p>' +
      '<div class="sh-w">' + esc(OUT_NOTE) + '</div>' +
      '<dl class="sh-meta">' +
        metaRow("Why we think so", o.basis) +

  /* ======================================================== THE GROUPING ==
     The Timeline and the Tracker are two views of one programme. They used to
     each decide for themselves what went where — the Timeline by month, the
     Tracker by phase — which meant a change to one silently disagreed with the
     other. Both now call this and nothing else, so they cannot drift: same
     items, same months, same order, same project headings. */
  function monthGroups(filterKey){
    var out = [];
    T.phases.forEach(function(p){
      var rows = ms.filter(function(m){
        return m.ph === p.id && (filterKey === "all" || m.p === filterKey); });
      if (!rows.length) return;
      var projects = [];
      T.pillars.forEach(function(pl){
        var r = rows.filter(function(m){ return m.p === pl.key; });
        if (r.length) projects.push({ pillar: pl, rows: r });
      });
      out.push({ phase: p, rail: p.rail, rows: rows, projects: projects });
    });
    return out;
  }

  function buildPlan(){
    var box = $("scr-plan");
    box.innerHTML = "";
    box.classList.toggle("nochips", outsOnly);
    box.appendChild(el("h1","lt","Timeline"));
    box.appendChild(el("p","lt-s", outsOnly
      ? (T.outcomesIntro || "What the programme is expected to produce, and roughly when.")
      : "Every deliverable in the order it happens. Tap one to see what it means."));

    /* the whole year in one picture first, the list after it */
    if (!outsOnly) box.appendChild(ganttCard());

    /* the tick box: strip everything back to what the work should produce */
    if (OUTS.length){
      var tick = el("button","tick" + (outsOnly ? " on" : ""),
        '<span class="bx" aria-hidden="true"></span>' +
        '<span class="mid"><span class="t">Projected outcomes only</span>' +
          '<span class="s">' + (outsOnly
            ? "Deliverables hidden. Tap again for the full timeline."
            : "Hide the delivery detail and show what it should produce") + '</span></span>' +
        '<span class="n">' + OUTS.length + '</span>');
      tick.type = "button";
      tick.setAttribute("role","checkbox");
      tick.setAttribute("aria-checked", outsOnly ? "true" : "false");
      tick.addEventListener("click", function(){
        outsOnly = !outsOnly;
        buildPlan();
        window.scrollTo({ top:0, behavior: reduced ? "auto" : "smooth" });
      });
      box.appendChild(tick);
    }

    /* filtering by project only makes sense when deliverables are on screen */
    if (!outsOnly){
      var chips = el("div","chips");
      var mk = function(key, label, n){
        var c = el("button","chip" + (pillar === key ? " on" : ""), esc(label) + "<b>" + n + "</b>");
        c.type = "button";
        c.addEventListener("click", function(){
          pillar = key; buildPlan();
          var box2 = $("scr-plan"), on = box2.querySelector(".chip.on");
          if (on && on.scrollIntoView) on.scrollIntoView({ block:"nearest", inline:"center",
            behavior: reduced ? "auto" : "smooth" });
        });

      };
      mk("all", "Everything", ms.length);
      T.pillars.forEach(function(p){
        mk(p.key, p.name, ms.filter(function(m){ return m.p === p.key; }).length);
      });
      box.appendChild(chips);
    }

    /* One group per window of the year. The month is the only heading — the
       work under it is white, every deliverable under that is light blue, and
       the three gap sizes are what make it navigable without a single box. */
    var any = 0;
    var groups = outsOnly ? T.phases.map(function(p){
      return { phase: p, rail: p.rail, outs: outsIn(p.id) }; }) : monthGroups(pillar);

    groups.forEach(function(gr){
      var p = gr.phase;
      var outs = outsOnly ? gr.outs : null;
      if (outsOnly && !outs.length) return;
      any++;

      var n = outsOnly ? outs.length : gr.rows.length;
      box.appendChild(el("div","tl-m" + (any === 1 ? " f" : ""),
        '<span>' + esc(gr.rail) + '</span><b>' + n + " " +
        (outsOnly ? (n === 1 ? "outcome" : "outcomes")
                  : (n === 1 ? "deliverable" : "deliverables")) + '</b>'));

      var g = el("section", outsOnly ? "tl-g tl-o" : "tl-g");

      if (outsOnly){
        outs.forEach(function(o){ g.appendChild(outcomeBox(o)); });
      } else {
        gr.projects.forEach(function(pr){
          var pl = pr.pillar, rows = pr.rows;
          g.appendChild(el("div","tl-t", esc(pl.name) + "<b>" + rows.length + "</b>"));
          var lane = el("div","tl-l");
          rows.forEach(function(m){
            var s = st(m.s);
            var b = el("button","tl-d",
              '<span class="tl-x">' + esc(m.t) + '</span>' +
              (m.s === "todo" ? "" : '<span class="st ' + s.cls + '">' + esc(s.label) + '</span>'));
            b.type = "button";
            b.addEventListener("click", function(){ milestoneSheet(m); });
            lane.appendChild(b);
          });
          g.appendChild(lane);
        });
      }
      box.appendChild(g);
    });

    if (!any){
      var e = el("div","empty", outsOnly
        ? "No projected outcomes recorded yet."
        : "Nothing in this project yet.<br><button type='button'>Show everything</button>");
      var btn = e.querySelector("button");
      if (btn) btn.addEventListener("click", function(){ pillar = "all"; buildPlan(); });
      e.style.marginTop = "26px";
      box.appendChild(e);
    }

    requestAnimationFrame(function(){ tlMeasure("scr-plan"); });

    box.appendChild(el("p","note", outsOnly
      ? OUT_NOTE + " Each box says what it rests on and what would stop it. " +
        "Timing is calculated from the windows in the agreement" +
        (firm ? "." : ", from a provisional kick-off of " + fmt(start) + ".")
      : "Months are the window the work runs in, not booked dates. The order matters more " +
        "than the dates: sequencing is confirmed at the start and depends on team capacity, " +
        "content availability and technical scope." + (firm ? "" :
        " Everything is calculated from a provisional kick-off of " + fmt(start) + ".")));
  }

  /* ======================================================= HIS OWN TRACKER =
     Everything above reports what Digital Movement says. This screen is Paul's
     own copy: he sets the status, it saves in this browser on this phone, and
     it never touches what we publish. Two rules keep it honest — our status is
     always shown next to his, and one tap puts a line back to ours. */
  var TKEY = "hr-tracker-v1";
  var mine = {}, tkFilter = "all";

  var tkSavedAt = "";
  function tkLoad(){
    try{
      var raw = JSON.parse(window.localStorage.getItem(TKEY) || "{}");
      mine = raw && raw.mine ? raw.mine : {};
      if (raw && raw.at && Object.keys(mine).length)
        tkSavedAt = "Saved on this phone · " + new Date(raw.at).toLocaleString("en-GB",
          { day:"numeric", month:"short", hour:"2-digit", minute:"2-digit" });
    }catch(e){ mine = {}; }
  }
  function tkSave(){
    try{
      window.localStorage.setItem(TKEY, JSON.stringify({ mine:mine, at:new Date().toISOString() }));
      tkSavedAt = "Saved on this phone · " + new Date().toLocaleString("en-GB",
        { day:"numeric", month:"short", hour:"2-digit", minute:"2-digit" });
    }catch(e){
      tkSavedAt = "This browser will not let the page save. Export before you close it.";
    }
    var n = $("tkSaved"); if (n) n.textContent = tkSavedAt;
  }
  function mid(m){ return m.ph + "|" + m.p + "|" + m.o + "|" + m.t; }
  function tkState(m){ var k = mine[mid(m)]; return STATUS[k] ? k : m.s; }
  function tkOwn(m){ var k = mine[mid(m)]; return !!(STATUS[k] && k !== m.s); }
  function buzz(n){ try{ if (navigator.vibrate) navigator.vibrate(n); }catch(e){} }

  var TK_ORDER = ["todo","active","waiting","blocked","done"];
  var TK_LABEL = { todo:"Not started", active:"Under way",
                   waiting:"Waiting on you", blocked:"Blocked", done:"Done" };

  function tkSet(m, k){
    var id = mid(m);
    if (k === m.s) delete mine[id]; else mine[id] = k;   /* back to ours = no override */
    tkSave();

    var card = $("scr-track").querySelector('.tkc[data-id="' + cssEsc(id) + '"]');
    if (card){
      card.dataset.s = k;
      card.classList.toggle("mine", tkOwn(m));
      var chip = card.querySelector(".stc");
      chip.dataset.s = k;
      chip.innerHTML = '<span class="dot"></span>' + esc(TK_LABEL[k]);
      card.querySelector(".tkc-s").textContent =
        tkOwn(m) ? "we say " + oursWord(m) : "";
      card.classList.remove("bump"); void card.offsetWidth; card.classList.add("bump");
    }
    tkHead();
    buzz(k === "done" ? 14 : 8);
    if (k === "done" && card) burstIf(m, card);
  }
  function cssEsc(s){ return s.replace(/["\\]/g, "\\$&"); }

  /* a whole phase finishing is worth marking, once */
  function burstIf(m, node){
    if (reduced) return;
    var sib = ms.filter(function(x){ return x.ph === m.ph; });
    if (!sib.length || !sib.every(function(x){ return tkState(x) === "done"; })) return;
    var r = node.getBoundingClientRect(), cx = r.left + r.width/2, cy = r.top + r.height/2;
    for (var i = 0; i < 16; i++){
      (function(i){
        var s = el("i","spark");
        s.style.background = i % 3 ? "#3AD6C5" : "#CB8CFF";
        s.style.left = cx + "px"; s.style.top = cy + "px";
        document.body.appendChild(s);
        var a = (i/16) * Math.PI * 2, d = 70 + Math.random() * 60;
        s.animate([{ transform:"translate(-50%,-50%) scale(1)", opacity:1 },
                   { transform:"translate(" + (Math.cos(a)*d - 50) + "%," +
                     (Math.sin(a)*d - 50) + "%) scale(.3)", opacity:0 }],
                  { duration:660 + Math.random()*240, easing:"cubic-bezier(.2,.7,.3,1)" })
          .onfinish = function(){ s.remove(); };
      })(i);
    }
  }

  function tkList(){
    return ms.filter(function(m){ return tkFilter === "all" || m.p === tkFilter; });
  }

  /* the hero counts, redrawn without rebuilding the list under his thumb */
  function tkHead(){
    var list = tkList();
    var done = list.filter(function(m){ return tkState(m) === "done"; }).length;
    var p = list.length ? Math.round(done/list.length*100) : 0;
    var n = $("tkPct"); if (n) n.textContent = p + "%";
    var c = $("tkCount");
    if (c) c.innerHTML = "<b>" + done + " of " + list.length + "</b> ticked off" +
      (tkFilter === "all" ? " across the whole programme."
                          : " in " + esc(pillarOf(tkFilter).name) + ".");
    var f = $("tkRing");
    if (f){
      var circ = 2 * Math.PI * 25;
      f.style.strokeDashoffset = (circ * (1 - p/100)).toFixed(1);
    }
    monthGroups(tkFilter).forEach(function(gr){
      var b = $("tkm-" + gr.phase.id);
      if (b) b.textContent = gr.rows.filter(function(m){ return tkState(m) === "done"; }).length +
        " of " + gr.rows.length + " ticked";
      gr.projects.forEach(function(pr){
        var e = $("tkp-" + gr.phase.id + "-" + pr.pillar.key);
        if (e) e.textContent = pr.rows.filter(function(m){ return tkState(m) === "done"; }).length +
          "/" + pr.rows.length;
      });
    });

    var own = ms.filter(tkOwn).length;
    $("trackBadge").textContent = own;
    $("trackBadge").hidden = !own;
  }

  function tkCard(m){
    var k = tkState(m);
    var c = el("div","tkc" + (tkOwn(m) ? " mine" : ""));
    c.dataset.s = k;
    c.dataset.id = mid(m);
    c.innerHTML =
      '<button type="button" class="tkc-t">' + esc(m.t) + '</button>' +
      '<button type="button" class="stc" data-s="' + k + '">' +
        '<span class="dot"></span>' + esc(TK_LABEL[k]) + '</button>' +
      /* only says anything when his mark and ours disagree — that difference is
         the one thing this screen must never hide */
      '<span class="tkc-s">' + (tkOwn(m) ? 'we say ' + esc(oursWord(m)) : '') + '</span>';
    c.querySelector(".stc").addEventListener("click", function(){ pickSheet(m); });
    c.querySelector(".tkc-t").addEventListener("click", function(){ milestoneSheet(m); });
    return c;
  }

  function oursWord(m){ return (TK_LABEL[m.s] || "not started").toLowerCase(); }

  function pickSheet(m){
    var here = tkState(m);
    var html =
      '<div class="sh-k" style="color:var(--teal)">Your tracker</div>' +
      '<h2 class="sh-t">' + esc(m.t) + '</h2>' +
      '<p class="sh-d">Where do you think this stands?</p>' +
      '<div class="pk">';
    TK_ORDER.forEach(function(k){
      html += '<button type="button" data-k="' + k + '" data-s="' + k + '"' +
        (k === here ? ' class="sel"' : '') + '>' +
        '<span class="dot"></span>' + esc(TK_LABEL[k]) +
        (k === here ? '<span class="ok">Now</span>' : '') + '</button>';
    });
    html += '</div><p class="ours">We have this down as <b>' + esc(oursWord(m)) +
      '</b>. Setting it back to that removes your mark. What you choose here stays on this phone.</p>';
    openSheet(html);
    Array.prototype.forEach.call(sheetIn.querySelectorAll(".pk button"), function(b){
      b.addEventListener("click", function(){ tkSet(m, b.dataset.k); closeSheet(); });
    });
  }

  function tkReport(){
    var out = ["HUSBAND RETAIL — YOUR TRACKER",
               new Date().toLocaleString("en-GB"),
               "Your marks, not Digital Movement's published status.", ""];
    T.phases.forEach(function(p){
      var rows = ms.filter(function(m){ return m.ph === p.id; });
      if (!rows.length) return;
      out.push("PHASE " + p.n + " — " + p.name.toUpperCase() +
        "  (" + monthSpan(p) + (firm ? "" : ", provisional") + ")");
      rows.forEach(function(m){
        var k = tkState(m), pad = TK_LABEL[k];
        while (pad.length < 16) pad += " ";
        out.push("  [" + pad + "] " + m.t + (tkOwn(m) ? "   <- your mark" : ""));
      });
      out.push("");
    });
    var done = ms.filter(function(m){ return tkState(m) === "done"; }).length;
    out.push(done + " of " + ms.length + " ticked off.",
             ms.filter(tkOwn).length + " differ from what we publish.", "",
             "Every line traces to the service agreement issued " + fmt(parse(M.contractIssued)) + ".");
    return out.join("\n");
  }

  function exportSheet(){
    openSheet(
      '<div class="sh-k" style="color:var(--teal)">Your tracker</div>' +
      '<h2 class="sh-t">Send it on</h2>' +
      '<p class="sh-d">A plain-text copy of every line and where you have it. ' +
      'Paste it into an email or a message.</p>' +
      '<textarea class="sh-out" id="tkOut" readonly></textarea>' +
      '<button type="button" class="sh-go" id="tkCopy">Copy it</button>');
    $("tkOut").value = tkReport();
    $("tkCopy").addEventListener("click", function(){
      var ta = $("tkOut"), b = $("tkCopy");
      var done = function(){ b.textContent = "Copied"; setTimeout(function(){ b.textContent = "Copy it"; }, 1500); };
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(ta.value).then(done, function(){ legacy(); });
      } else legacy();
      function legacy(){
        ta.removeAttribute("readonly"); ta.select();
        try{ document.execCommand("copy"); }catch(e){}
        ta.setAttribute("readonly",""); done();
      }
    });
  }

  function buildTrack(){
    var box = $("scr-track");
    box.innerHTML = "";
    box.appendChild(el("h1","lt","Your tracker"));
    box.appendChild(el("p","lt-s",
      "Every line of the programme, and where you have it. Tick things off as you see them land."));

      "This screen is yours. What you set here is saved in this browser on this phone, " +

    var circ = 2 * Math.PI * 25;
    var hero = el("div","tk-hero",
      '<div class="k">Your count</div>' +
      '<div class="ring"><svg viewBox="0 0 58 58" aria-hidden="true">' +
        '<circle class="t" cx="29" cy="29" r="25"/>' +
        '<circle class="f" id="tkRing" cx="29" cy="29" r="25" stroke-dasharray="' + circ.toFixed(1) +

      c.type = "button";
      c.addEventListener("click", function(){
        tkFilter = key; buildTrack();
        var on = $("scr-track").querySelector(".chip.on");
        if (on && on.scrollIntoView) on.scrollIntoView({ block:"nearest", inline:"center",
          behavior: reduced ? "auto" : "smooth" });
      });
      chips.appendChild(c);
    };
    mk("all", "Everything", ms.length);
    T.pillars.forEach(function(p){
      mk(p.key, p.name, ms.filter(function(m){ return m.p === p.key; }).length);
    });
    box.appendChild(chips);

    /* Same shape as the Timeline, down to the month bands and the project
       headings, because it is the same list of work. The only difference is
       that each row here is something he can tick. */

      box.appendChild(el("div","tl-m" + (any === 1 ? " f" : ""),

      var g = el("section","tl-g");

        var lane = el("div","tl-l tk-lane");

    var tools = el("div","tk-tools");

    ex.addEventListener("click", exportSheet);

    rs.addEventListener("click", function(){
      if (!ms.filter(tkOwn).length) return;

      mine = {}; tkSave(); buildTrack(); buzz(12);
