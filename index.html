<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Project+</title>
<link rel="icon" type="image/svg+xml" href="tracker/assets/dm-mark.svg">
<link rel="icon" href="tracker/assets/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="tracker/assets/apple-touch-icon.png">
<meta http-equiv="refresh" content="0; url=tracker/">
<style>
  :root{ --bg:#0B0B0C; --tx:#F5F5F7; --tx-2:#8C8C93; --blue:#57ADFF; }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    min-height:100svh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--tx);
    font:400 19px/1.6 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; padding:32px;
  }
  main{max-width:34rem; text-align:center}
  h1{margin:0; font-size:34px; line-height:1.2; font-weight:600; letter-spacing:-.02em}
  h1 span{color:var(--blue)}
  p{margin:14px 0 0; font-size:18px; color:var(--tx-2)}
  a.go{
    display:inline-flex; align-items:center; justify-content:center;
    margin-top:28px; min-height:56px; padding:0 28px;
    background:var(--blue); color:#0B0B0C; text-decoration:none;
    font-size:18px; font-weight:600; border-radius:12px;
  }
  a.go:hover{filter:brightness(1.08)}
  a.go:focus-visible{outline:3px solid #fff; outline-offset:3px}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
  <main>
    <h1>Project<span>+</span></h1>
    <p>Your programme, in one place. Sign in to see it.</p>
    <a class="go" href="tracker/">Open Project+</a>
  </main>
</body>
</html>
